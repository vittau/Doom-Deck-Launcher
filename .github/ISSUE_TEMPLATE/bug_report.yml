name: Bug report
description: Something in DDL does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing DDL. It is experimental, so every report helps.
        Problems inside a game itself are often DSDA-Doom or mapset issues; tell us anyway and we will route them.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DDL version
      description: Shown as "App version" in Settings, or run `ddl --version`.
      placeholder: "0.0.18"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Flatpak (doomdecklauncher.com)
        - Linux tarball (GitHub Releases)
        - Built from source
    validations:
      required: true
  - type: input
    id: mapset
    attributes:
      label: Mapset or setup involved
      placeholder: "e.g. SIGIL II, or a custom setup"
  - type: textarea
    id: doctor
    attributes:
      label: ddl doctor output
      description: |
        In Desktop Mode, run in Konsole and paste the result:
        Flatpak: `flatpak run --command=ddl com.doomdecklauncher.DoomDeckLauncher doctor`
        Tarball: `./ddl doctor`
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        Optional. The last lines of `ddl.log`; its path is shown by `ddl doctor`
        (Flatpak: `~/.var/app/com.doomdecklauncher.DoomDeckLauncher/.local/state/ddl/logs/ddl.log`).
      render: text
