# Continuous integration for DoomDeckLauncher (spec 001, R6).
#
# Four jobs:
#   * `checks`        - formatting, lints and unit tests on the GitHub-hosted
#                       Ubuntu runner, mirroring the commands in `AGENTS.md`;
#   * `catalog-lint`  - offline recipe validation on every pull request;
#   * `catalog-bundle`- publishes the catalog bundle to the `catalog` branch on
#                       a push to `main` that touches `catalog/**`, on the first
#                       publish (the branch does not exist yet) and when run by
#                       hand on `main` (spec 019, R2);
#   * `steamrt-build` - a release-mode build inside the same Steam Linux Runtime
#                       SDK container the release uses, to prove the binary
#                       actually links against SteamOS/Yocto-era libraries before
#                       anyone downloads it.
#
# The container image is pinned by digest (see `docs/research/steam-runtime-build.md`).
# The same digest is used by `.github/workflows/release.yml`; keep them in sync.
name: CI

# Pushes to main and pull requests, only when something that affects the build or tests
# changed. Docs, status/journal, Markdown and orchestration scripts do not rebuild anything
# (`docs/design/` stays: the headless UI tests read its reference images). Tag pushes do not
# run CI either: `release.yml` builds and smoke-tests the tagged commit itself.
# `workflow_dispatch` (spec 019, R2) lets a maintainer publish the catalog bundle on
# demand; only the `catalog-bundle` job reacts to it, and only on `main`.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - 'docs/design/**'
      - '!**/*.md'
      - '!scripts/orchestration/**'
      - '!LICENSE'
      - '!packaging/flatpak/site/**'
      - '!scripts/flatpak/render-site.py'
      - '!.github/workflows/project-site.yml'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - 'docs/design/**'
      - '!**/*.md'
      - '!scripts/orchestration/**'
      - '!LICENSE'
      - '!packaging/flatpak/site/**'
      - '!scripts/flatpak/render-site.py'
      - '!.github/workflows/project-site.yml'
  workflow_dispatch:

# A newer push to the same branch or PR supersedes a running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository; `release.yml` and the `catalog-bundle` job (which opts in
# to `contents: write` itself) are the only writers.
permissions:
  contents: read

# Container jobs otherwise default to `sh` (dash in the Steam Runtime image), which has no
# `set -o pipefail`; every step here is written for bash.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # CI builds from scratch or from the cache below; incremental artifacts only bloat it.
  CARGO_INCREMENTAL: 0
  # Keep the failure output useful when a test panics.
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      # The checkout supplies `rust-toolchain.toml`, which the next step reads.
      - uses: actions/checkout@v4

      # Install rustup only (`--default-toolchain none`): the exact channel and
      # components come from `rust-toolchain.toml`, so CI can never drift from
      # local development. No third-party toolchain action is used, which keeps
      # the supply chain to `actions/*` and the official rustup script.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          # Make cargo/rustc visible to the remaining steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Read the channel back out of the pin, then install it explicitly so
          # this job never depends on rustup's on-demand install behaviour.
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "Pinned toolchain: $channel"
          # `rustfmt`/`clippy` are repeated here on purpose: `components` in
          # rust-toolchain.toml is for local development, this line is what the
          # CI job relies on.
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo --version

      # Cargo registry and build artifacts, keyed by the lockfile and toolchain pin, so an
      # unchanged dependency tree is not recompiled on every push.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            checks-${{ runner.os }}-

      # Slint's text stack (`parley` -> `fontique` -> `yeslogic-fontconfig-sys`)
      # probes fontconfig with pkg-config at build time on Linux. Everything
      # else (EGL, GL, X11, Wayland, xkbcommon) is loaded with `dlopen`. gilrs
      # (D-018) links libudev for controller hotplug, so it needs libudev-dev;
      # the Steam Runtime SDK image already ships it.
      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libudev-dev

      # The three commands from AGENTS.md. `--locked` makes CI fail if
      # `Cargo.lock` is out of date instead of silently updating it.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  catalog-lint:
    name: Offline catalog lint
    # Run for every PR, including every catalog/ change; no network fetches in CI.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The checkout supplies `rust-toolchain.toml`, which the next step reads.
      - uses: actions/checkout@v4

      # Install rustup only (`--default-toolchain none`): the exact channel and
      # components come from `rust-toolchain.toml`, so CI can never drift from
      # local development. No third-party toolchain action is used, which keeps
      # the supply chain to `actions/*` and the official rustup script.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          # Make cargo/rustc visible to the remaining steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Read the channel back out of the pin, then install it explicitly so
          # this job never depends on rustup's on-demand install behaviour.
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "Pinned toolchain: $channel"
          # `rustfmt`/`clippy` are repeated here on purpose: `components` in
          # rust-toolchain.toml is for local development, this line is what the
          # CI job relies on.
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo --version

      # Cargo registry and build artifacts, keyed by the lockfile and toolchain pin, so an
      # unchanged dependency tree is not recompiled on every push.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: catalog-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            catalog-${{ runner.os }}-

      # Slint's text stack (`parley` -> `fontique` -> `yeslogic-fontconfig-sys`)
      # probes fontconfig with pkg-config at build time on Linux. Everything
      # else (EGL, GL, X11, Wayland, xkbcommon) is loaded with `dlopen`. gilrs
      # (D-018) links libudev for controller hotplug, so it needs libudev-dev;
      # the Steam Runtime SDK image already ships it.
      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libudev-dev

      - name: Validate all recipes
        run: cargo run --locked -p ddl -- catalog lint catalog/

  catalog-bundle:
    name: Publish catalog bundle
    # Only a push to `main`, or a manual run on `main`, can publish; pull
    # requests, tags and other refs never write the branch (spec 019, R2).
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize bundle jobs instead of cancelling them. Each one commits on top
    # of the previous `catalog` head; cancelling a run mid-push or racing two
    # runs would produce a rejected non-fast-forward push, and the branch is
    # never force-pushed (spec 019, R2).
    concurrency:
      group: catalog-bundle
      cancel-in-progress: false
    # The only job that writes to the repository; `contents: read` stays the
    # workflow default and this job opts in (spec 019, R2).
    permissions:
      contents: write
    steps:
      # Full history so the changed-paths check can diff against the push base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `catalog/**` only, plus two exceptions: a manual run on `main` always
      # publishes, and so does the very first publish, when the remote `catalog`
      # branch does not exist yet (spec 019 review fix).
      - name: Detect catalog changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --exit-code origin refs/heads/catalog >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "${{ github.sha }}" -- catalog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Install rustup only (`--default-toolchain none`): the exact channel and
      # components come from `rust-toolchain.toml`, so CI can never drift from
      # local development. No third-party toolchain action is used, which keeps
      # the supply chain to `actions/*` and the official rustup script.
      - name: Install the pinned Rust toolchain
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "Pinned toolchain: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo --version

      # Cargo registry and build artifacts, keyed by the lockfile and toolchain pin, so an
      # unchanged dependency tree is not recompiled on every push.
      - name: Cache cargo registry and target
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: bundle-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            bundle-${{ runner.os }}-

      # `ddl` links Slint (fontconfig) and gilrs (libudev) on Linux; same
      # packages as the other jobs.
      - name: Install system build dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libudev-dev

      # Spec 019, R1/R3: the bundle's serial is the source commit's UTC Unix
      # time, the same value `build.rs` bakes into a release built from this
      # commit. `ddl catalog bundle` refuses to write on any lint error.
      - name: Build the catalog bundle
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Pass the values as arguments: a `$GITHUB_ENV` write only reaches later steps,
          # so exporting it here left the first published bundle at serial 0.
          serial="$(git log -1 --format=%ct "${GITHUB_SHA}")"
          test "$serial" -gt 0
          cargo run --locked -p ddl -- catalog bundle --out "$RUNNER_TEMP/catalog.json" \
            --serial "$serial" --commit "${GITHUB_SHA}"

      # Orphan `catalog` branch, ordinary commits only: the branch holds exactly
      # one file, `catalog.json`. The app reads it from
      # raw.githubusercontent.com/vittau/Doom-Deck-Launcher/catalog/catalog.json.
      - name: Commit the bundle to the catalog branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "ddl-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/catalog >/dev/null 2>&1; then
            git fetch --depth=1 origin catalog
            git checkout -B catalog FETCH_HEAD
          else
            git checkout --orphan catalog
          fi
          git rm -rf --quiet . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/catalog.json" catalog.json
          git add -f catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json is unchanged; nothing to publish"
            exit 0
          fi
          git commit -m "catalog: update from ${GITHUB_SHA}"
          # Ordinary, non-fast-forward-refusing push; never `--force`.
          git push origin HEAD:catalog

  steamrt-build:
    name: Steam Runtime release build
    runs-on: ubuntu-latest
    # Steam Linux Runtime 3.0 "sniper" SDK, pinned by the digest of tag
    # 3.0.20261007.263965 (see docs/research/steam-runtime-build.md for why
    # sniper and how the digest was verified).
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk@sha256:220d1dc739254155a91c010f959a4f8e7c183e69d18300d6be53a20aee12b02d
    steps:
      # The image is Debian 11 based and has no Rust, so install rustup here too
      # (same steps as the `checks` job; the image already ships curl and a C
      # toolchain, and `HOME` is set by the runner).
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo --version

      # Cargo registry and build artifacts, keyed by the lockfile and toolchain pin, so an
      # unchanged dependency tree is not recompiled on every push.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: steamrt-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            steamrt-${{ runner.os }}-

      # Release profile, exactly what `release.yml` ships. `--locked` keeps the
      # reviewed dependency versions.
      - name: cargo build --release -p ddl
        run: cargo build --release --locked -p ddl

      # `--version` and `--help` exit before any window is created, so they work
      # on a headless runner and prove the binary starts against the runtime's
      # libraries.
      - name: Smoke test the release binary
        run: |
          set -euo pipefail
          ./target/release/ddl --version
          ./target/release/ddl --help

      # The authoritative list of shared libraries the binary needs on
      # SteamOS; recorded in the CI log and summarised in
      # docs/research/steam-runtime-build.md.
      - name: Print shared library requirements
        run: ldd target/release/ddl
