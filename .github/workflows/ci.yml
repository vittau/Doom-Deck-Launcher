name: CI

# Only build inputs start automatic Rust checks. Catalog changes retain their
# independent lint/publication path; docs/design contains headless reference art.
# Release SDK builds and smoke checks belong to release.yml on tags.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'catalog/**'
      - 'tests/**'
      - 'docs/design/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '!**/*.md'
  pull_request:
    paths:
      - 'crates/**'
      - 'catalog/**'
      - 'tests/**'
      - 'docs/design/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      full_tests:
        description: 'Run all offline tests, including the ten exhaustive render cases (no catalog publication)'
        type: boolean
        default: false
      publish_catalog:
        description: 'Publish catalog on main (ignored when full_tests is enabled)'
        type: boolean
        default: false

# A newer push to the same branch or PR supersedes a running one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repository; `release.yml` and the `catalog-bundle` job (which opts in
# to `contents: write` itself) are the only writers.
permissions:
  contents: read

# Every shell step uses bash with pipefail available.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # CI builds from scratch or from the cache below; incremental artifacts only bloat it.
  CARGO_INCREMENTAL: 0
  # Keep the failure output useful when a test panics.
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: fmt, clippy, offline tests and catalog lint
    if: github.event_name != 'workflow_dispatch' || inputs.full_tests
    runs-on: ubuntu-latest
    steps:
      # The checkout supplies `rust-toolchain.toml`, which the next step reads.
      - uses: actions/checkout@v4

      # Install rustup only (`--default-toolchain none`): the exact channel and
      # components come from `rust-toolchain.toml`, so CI can never drift from
      # local development. No third-party toolchain action is used, which keeps
      # the supply chain to `actions/*` and the official rustup script.
      - name: Install the pinned Rust toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          # Make cargo/rustc visible to the remaining steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # Read the channel back out of the pin, then install it explicitly so
          # this job never depends on rustup's on-demand install behaviour.
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "Pinned toolchain: $channel"
          # `rustfmt`/`clippy` are repeated here on purpose: `components` in
          # rust-toolchain.toml is for local development, this line is what the
          # CI job relies on.
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo --version

      # Cargo registry and build artifacts, keyed by the lockfile and toolchain pin, so an
      # unchanged dependency tree is not recompiled on every push.
      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: checks-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            checks-${{ runner.os }}-

      # Slint's text stack (`parley` -> `fontique` -> `yeslogic-fontconfig-sys`)
      # probes fontconfig with pkg-config at build time on Linux. Everything
      # else (EGL, GL, X11, Wayland, xkbcommon) is loaded with `dlopen`. gilrs
      # (D-018) links libudev for controller hotplug, so it needs libudev-dev;
      # the Steam Runtime SDK image already ships it.
      - name: Install system build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libudev-dev

      # The three commands from AGENTS.md. `--locked` makes CI fail if
      # `Cargo.lock` is out of date instead of silently updating it.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Ordinary offline tests (skip ten exhaustive render cases)
        if: github.event_name != 'workflow_dispatch'
        run: >-
          cargo test --workspace --locked --
          --skip headless::journeys::title_fit_
          --skip headless::journeys::categories_favorites_and_screenshots

      - name: Full offline suite (all exhaustive render cases included)
        if: github.event_name == 'workflow_dispatch' && inputs.full_tests
        run: cargo test --workspace --locked

      # Reuse this job's compiled workspace instead of a separate PR job/cache.
      - name: Offline catalog lint
        run: cargo run --locked -p ddl -- catalog lint catalog/

  catalog-bundle:
    name: Publish catalog bundle
    # Only a push to `main`, or an explicit catalog-only manual run, can publish; pull
    # requests, tags and other refs never write the branch (spec 019, R2).
    if: >-
      (github.event_name == 'push'
       || (github.event_name == 'workflow_dispatch' && inputs.publish_catalog && !inputs.full_tests))
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize bundle jobs instead of cancelling them. Each one commits on top
    # of the previous `catalog` head; cancelling a run mid-push or racing two
    # runs would produce a rejected non-fast-forward push, and the branch is
    # never force-pushed (spec 019, R2).
    concurrency:
      group: catalog-bundle
      cancel-in-progress: false
    # The only job that writes to the repository; `contents: read` stays the
    # workflow default and this job opts in (spec 019, R2).
    permissions:
      contents: write
    steps:
      # Full history so the changed-paths check can diff against the push base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `catalog/**` only, plus two exceptions: a manual run on `main` always
      # publishes, and so does the very first publish, when the remote `catalog`
      # branch does not exist yet (spec 019 review fix).
      - name: Detect catalog changes
        id: changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git ls-remote --exit-code origin refs/heads/catalog >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$base" "${{ github.sha }}" -- catalog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Install rustup only (`--default-toolchain none`): the exact channel and
      # components come from `rust-toolchain.toml`, so CI can never drift from
      # local development. No third-party toolchain action is used, which keeps
      # the supply chain to `actions/*` and the official rustup script.
      - name: Install the pinned Rust toolchain
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o rustup-init.sh
          sh rustup-init.sh -y --profile minimal --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$channel"
          echo "Pinned toolchain: $channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          rustup default "$channel"
          cargo --version

      # Cargo registry and build artifacts, keyed by the lockfile and toolchain pin, so an
      # unchanged dependency tree is not recompiled on every push.
      - name: Cache cargo registry and target
        if: steps.changes.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: bundle-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            bundle-${{ runner.os }}-

      # `ddl` links Slint (fontconfig) and gilrs (libudev) on Linux; same
      # packages as the other jobs.
      - name: Install system build dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libfontconfig1-dev libudev-dev

      # Spec 019 R1/R3, corrected by spec 077 R3: the serial is the UTC Unix
      # time of the newest commit that touched `catalog/` — the catalog's
      # content time, not the app commit. `build.rs` bakes the same value into
      # every binary built from this commit, so the embedded and published
      # serials describe the same catalog content. `ddl catalog bundle` refuses
      # to write on any lint error.
      - name: Build the catalog bundle
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Pass the values as arguments: a `$GITHUB_ENV` write only reaches later steps,
          # so exporting it here left the first published bundle at serial 0.
          serial="$(git log -1 --format=%ct "${GITHUB_SHA}" -- catalog/)"
          test "$serial" -gt 0
          cargo run --locked -p ddl -- catalog bundle --out "$RUNNER_TEMP/catalog.json" \
            --serial "$serial" --commit "${GITHUB_SHA}"

      # Orphan `catalog` branch, ordinary commits only: the branch holds exactly
      # one file, `catalog.json`. The app reads it from
      # raw.githubusercontent.com/vittau/Doom-Deck-Launcher/catalog/catalog.json.
      - name: Commit the bundle to the catalog branch
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "ddl-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/catalog >/dev/null 2>&1; then
            git fetch --depth=1 origin catalog
            git checkout -B catalog FETCH_HEAD
          else
            git checkout --orphan catalog
          fi
          git rm -rf --quiet . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/catalog.json" catalog.json
          git add -f catalog.json
          if git diff --cached --quiet; then
            echo "catalog.json is unchanged; nothing to publish"
            exit 0
          fi
          git commit -m "catalog: update from ${GITHUB_SHA}"
          # Ordinary, non-fast-forward-refusing push; never `--force`.
          git push origin HEAD:catalog
