# Temporary diagnostic for the Headless Chicken startup crash (removed after use).
#
# Reproduces on Linux with the official AppImage, the public idgames archive and
# Freedoom as the IWAD (no commercial game data), then prints a backtrace.
name: Diagnose HC crash

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch engine, mapset and a free IWAD
        run: |
          set -euo pipefail
          curl -fsSL -o dsda.AppImage \
            https://github.com/dsda-org/dsda-doom/releases/download/v0.30.1/dsda-doom-0.30.1-linux-x86_64.appimage
          echo "b06adf3f0c7d4e82dc1870baf97e67e4dc4e663e37f69070ddc02fa3e97608b0  dsda.AppImage" | sha256sum -c -
          chmod +x dsda.AppImage
          ./dsda.AppImage --appimage-extract >/dev/null
          curl -fsSL -o hc.zip \
            https://ftp.fu-berlin.de/pc/games/idgames/levels/doom2/Ports/megawads/hdlschkn.zip
          echo "de8926c8d3c22dc739718eb06c18da994f3a9fcd12c0f404cbc4c342ec5c4659  hc.zip" | sha256sum -c -
          unzip -o -q hc.zip
          curl -fsSL -o freedoom.zip \
            https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
          unzip -o -q freedoom.zip
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdb libopengl0 libgl1 libglu1-mesa libsdl2-2.0-0 \
            libsndfile1 libfluidsynth3 libportmidi0 libmad0 libvorbisfile3 libxkbcommon0
          echo "--- appdir ---"
          ls squashfs-root/usr/bin
          find squashfs-root -name '*.so*' -maxdepth 5 | head -20

      - name: Run the engine under gdb
        run: |
          set -uo pipefail
          mkdir -p run/data run/save
          cat > gdb.cmd <<EOF
          set pagination off
          set environment LD_LIBRARY_PATH $PWD/squashfs-root/usr/lib
          set environment SDL_AUDIODRIVER dummy
          set environment SDL_VIDEODRIVER dummy
          EOF
          cat >> gdb.cmd <<'GDB'
          break GetSndData
          commands
          silent
          printf "GetSndData sfxid=%d len=%ld head=%02x%02x%02x%02x\n", $rdi, $rdx, *(unsigned char*)$rsi, *(unsigned char*)($rsi+1), *(unsigned char*)($rsi+2), *(unsigned char*)($rsi+3)
          continue
          end
          run
          bt
          GDB
          timeout 150 gdb -batch -q -x gdb.cmd \
            --args squashfs-root/usr/bin/dsda-doom \
              -iwad freedoom-0.13.0/freedoom2.wad \
              -file HDLSCHKN.wad \
              -config run/cfg \
              -data run/data \
              -save run/save \
              -complevel mbf21 \
              -nodraw 2>&1 | tail -45
          echo "gdb-exit=$?"
