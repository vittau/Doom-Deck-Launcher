# Publish a signed Flatpak repository to
# https://www.vitormach.dev/Doom-Deck-Launcher/ (spec 063).
#
# This is the install channel for Steam Deck users. The built app is exported to
# an OSTree repository, signed with the dedicated repository key and committed to
# this repository's `gh-pages` branch, which GitHub Pages serves under the
# repository name. Users install with one command:
#
#   flatpak install --user --from \
#     https://www.vitormach.dev/Doom-Deck-Launcher/io.github.vittau.Doom-Deck-Launcher.flatpakref
#
# It is deliberately separate from `.github/workflows/flatpak.yml`, which stays
# an artifact-only validation job. Nothing here creates a GitHub Release, and
# nothing here is a Flathub submission.
#
# External references:
#   * actions/checkout v4, pinned by commit.
#   * flatpak-cargo-generator at commit 74697c7 (2026-09-30), plus its SHA-256.
#   * Runtime/SDK branch org.freedesktop.*//26.08 from Flathub.
#   * Rust 1.99.1 from static.rust-lang.org, pinned by SHA-256 in the manifest.
#
# Required repository secret:
#   FLATPAK_GPG_PRIVATE_KEY  base64 of the ASCII-armored private key
#                            (`scripts/flatpak/make-signing-key.sh` prints it)
#   FLATPAK_GPG_KEY_ID       optional; fingerprint, if the keyring holds > 1 key
#
# One-time setup (Pages source and the first `gh-pages` commit) is documented in
# docs/flatpak-remote.md.
name: Flatpak repository

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to publish"
        required: true
        default: main
        type: string

# The only write is the push to `gh-pages`; `main` is never touched. The Pages
# build request needs `pages: write` on the same token.
permissions:
  contents: write
  pages: write

# Never cancel a half-finished publication; let a queued run follow it.
concurrency:
  group: flatpak-remote
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  APP_ID: io.github.vittau.Doom-Deck-Launcher
  MANIFEST: packaging/flatpak/io.github.vittau.Doom-Deck-Launcher.yml
  SITE_BASE: https://www.vitormach.dev/Doom-Deck-Launcher
  PAGES_BRANCH: gh-pages
  GENERATOR_COMMIT: 74697c75b630d7330e77250fc13cb5ea688d9479
  GENERATOR_SHA256: 0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380

jobs:
  publish:
    name: Build and publish the Flatpak repository
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check the repository secret
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_KEY" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY is not set. Run scripts/flatpak/make-signing-key.sh."
            exit 1
          fi

      - name: Check out the source to publish
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Tag pushes must publish the tagged commit; manual runs pass a ref.
          ref: ${{ inputs.ref || github.sha }}
          # Spec 077 R3: the catalog serial is the content time of the newest
          # commit touching `catalog/`, so the history must reach that commit.
          fetch-depth: 0

      - name: Install Flatpak tooling
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder gnupg desktop-file-utils appstream
          flatpak --version
          flatpak-builder --version
          gpg --version | head -n 1

      - name: Add Flathub and install the 26.08 SDK/runtime
        run: |
          set -euo pipefail
          flatpak remote-add --if-not-exists --user flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08
          flatpak info --user org.freedesktop.Sdk//26.08 | tee "$RUNNER_TEMP/sdk-info.txt"

      - name: Generate and verify cargo-sources.json
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/generator-venv"
          "$RUNNER_TEMP/generator-venv/bin/pip" install --quiet --disable-pip-version-check \
            --no-cache-dir 'aiohttp==3.14.5' 'tomlkit==0.15.2'
          generator="$RUNNER_TEMP/flatpak-cargo-generator.py"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/${GENERATOR_COMMIT}/cargo/flatpak-cargo-generator.py" \
            -o "$generator"
          echo "$GENERATOR_SHA256  $generator" | sha256sum -c -
          "$RUNNER_TEMP/generator-venv/bin/python" "$generator" Cargo.lock \
            -o "$RUNNER_TEMP/cargo-sources.json"
          if ! cmp -s packaging/flatpak/cargo-sources.json "$RUNNER_TEMP/cargo-sources.json"; then
            echo "::error::packaging/flatpak/cargo-sources.json is stale; regenerate it from Cargo.lock"
            diff -u packaging/flatpak/cargo-sources.json "$RUNNER_TEMP/cargo-sources.json" | head -200 || true
            exit 1
          fi
          echo "cargo-sources.json matches Cargo.lock"

      - name: Check the pinned Rust compiler against the repository MSRV
        run: |
          set -euo pipefail
          toolchain="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' rust-toolchain.toml)"
          msrv="$(sed -n 's/^rust-version *= *"\([^"]*\)"/\1/p' Cargo.toml)"
          manifest_rust="$(grep -o 'dist/[^/]*/rust-[0-9][0-9.]*' "$MANIFEST" \
            | head -n 1 | sed 's#.*rust-##')"
          test -n "$toolchain"
          test -n "$msrv"
          test "$manifest_rust" = "$toolchain"
          test "$(printf '%s\n%s\n' "$msrv" "$toolchain" | sort -V | head -1)" = "$msrv"
          echo "toolchain=$toolchain msrv=$msrv"

      - name: Validate desktop entry and AppStream metainfo
        run: |
          set -euo pipefail
          desktop-file-validate packaging/flatpak/io.github.vittau.Doom-Deck-Launcher.desktop
          appstreamcli validate --no-net --explain \
            packaging/flatpak/io.github.vittau.Doom-Deck-Launcher.metainfo.xml

      - name: Import the repository signing key
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | base64 --decode | gpg --batch --quiet --import
          fingerprint="$GPG_KEY_ID"
          if [ -z "$fingerprint" ]; then
            fingerprint="$(gpg --batch --with-colons --list-secret-keys \
              | awk -F: '/^fpr:/ {print $10; exit}')"
          fi
          test -n "$fingerprint"
          gpg --batch --list-secret-keys "$fingerprint" >/dev/null
          # The committed public half must match the secret: a wrong or rotated
          # secret fails here instead of signing with an unexpected key.
          gpg --batch --export "$fingerprint" > "$RUNNER_TEMP/repo-key.gpg"
          cmp -s "$RUNNER_TEMP/repo-key.gpg" packaging/flatpak/repo-key.gpg || {
            echo "::error::packaging/flatpak/repo-key.gpg does not match FLATPAK_GPG_PRIVATE_KEY"
            exit 1
          }
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"
          echo "Signing key: $fingerprint"

      - name: Build the tagged tree
        run: |
          set -euo pipefail
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::$MANIFEST is missing. This ref predates the Flatpak packaging; publish a newer tag."
            exit 1
          fi
          # Spec 077 R3: the serial is the catalog's content time (the newest
          # commit touching catalog/), baked into the binary.
          serial="$(git log -1 --format=%ct -- catalog/)"
          test "$serial" -gt 0
          printf '%s\n' "$serial" > packaging/flatpak/catalog-serial
          echo "catalog serial: $serial"
          install -d -m 0700 "$RUNNER_TEMP/xdg"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$RUNNER_TEMP/build"
          flatpak-builder --user --arch=x86_64 --force-clean --disable-rofiles-fuse \
            "$RUNNER_TEMP/build" "$MANIFEST" 2>&1 | tee "$RUNNER_TEMP/flatpak-build.log"

      - name: Fetch the published site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          rm -rf "$site"
          # The token stays out of .git/config; the branch may not exist yet.
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
               clone --quiet --depth 1 --branch "$PAGES_BRANCH" \
               "https://github.com/${GITHUB_REPOSITORY}.git" "$site"; then
            echo "Reusing the published history on ${PAGES_BRANCH}"
          else
            rm -rf "$site"
            mkdir -p "$site"
            git -C "$site" init --quiet -b "$PAGES_BRANCH"
            git -C "$site" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            echo "First publication: ${PAGES_BRANCH} does not exist yet"
          fi
          install -d "$site/repo"
          # Git cannot store empty directories, so a fresh clone of the published
          # branch loses the empty parts of the OSTree layout. OSTree only
          # creates the layout for a new repository (ostree-repo.c returns early
          # when objects/ exists), so restore the full set before exporting:
          # tmp, state, extensions, refs/{heads,mirrors,remotes}, objects.
          for dir in tmp state extensions refs/heads refs/mirrors refs/remotes objects; do
            install -d "$site/repo/$dir"
          done

      - name: Export and sign the repository
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          timestamp="$(git log -1 --format=%cI)"
          subject="$(git log -1 --format=%s)"
          body="$(git log -1 --format=%H)"
          # Signed commit on the `stable` branch, reproducible from the tag date.
          flatpak build-export --arch=x86_64 \
            --timestamp="$timestamp" --subject="$subject" --body="$body" \
            --gpg-sign="$GPG_FINGERPRINT" --gpg-homedir="$GNUPGHOME" \
            "$site/repo" "$RUNNER_TEMP/build" stable
          # Sign the summary, ship static deltas, keep two older versions.
          flatpak build-update-repo \
            --title="DoomDeckLauncher" \
            --comment="Experimental DoomDeckLauncher builds for Steam Deck" \
            --homepage="https://github.com/vittau/Doom-Deck-Launcher" \
            --default-branch=stable \
            --generate-static-deltas --prune --prune-depth=2 \
            --gpg-sign="$GPG_FINGERPRINT" --gpg-homedir="$GNUPGHOME" \
            "$site/repo"
          du -sh "$site/repo"

      - name: Verify the signature and smoke-test the published build
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          install -d -m 0700 "$RUNNER_TEMP/xdg"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"

          # OSTree stores the summary signature in repo/summary.sig as a GVariant
          # (the `ostree.gpgsigs` map), not as a raw OpenPGP signature, so gpg
          # cannot verify that file directly. Let Flatpak/OSTree verify it.
          flatpak --user remote-add --if-not-exists \
            --gpg-import=packaging/flatpak/repo-key.gpg ddl-smoke "$site/repo"
          # With no collection ID, setting GPG verification also makes Flatpak
          # write gpg-verify-summary=true for this remote (flatpak 1.18).
          flatpak --user remote-modify --gpg-verify ddl-smoke
          flatpak --user remote-ls --app ddl-smoke

          # A fresh client using only the committed public key must install and
          # run the export; no --no-gpg-verify path is allowed here.
          flatpak --user install -y --noninteractive ddl-smoke "${APP_ID}//stable"
          flatpak run --command=ddl "${APP_ID}//stable" --version | tee "$RUNNER_TEMP/version.txt"
          version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          grep -Fx "ddl $version" "$RUNNER_TEMP/version.txt" >/dev/null
          flatpak --user uninstall -y "${APP_ID}//stable"
          flatpak --user remote-delete --force ddl-smoke

      - name: Render the site
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          version="$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          public_key="$(gpg --batch --export "$GPG_FINGERPRINT" | base64 | tr -d '\n')"
          test -n "$public_key"
          repo_url="${SITE_BASE}/repo/"

          cat > "$site/${APP_ID}.flatpakref" <<EOF
          [Flatpak Ref]
          Version=1
          Name=${APP_ID}
          Branch=stable
          Title=DoomDeckLauncher
          Comment=Experimental DoomDeckLauncher build for Steam Deck
          Homepage=https://github.com/vittau/Doom-Deck-Launcher
          Url=${repo_url}
          IsRuntime=false
          SuggestRemoteName=ddl
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          GPGKey=${public_key}
          EOF

          cat > "$site/ddl.flatpakrepo" <<EOF
          [Flatpak Repo]
          Version=1
          Title=DoomDeckLauncher
          Url=${repo_url}
          Homepage=https://github.com/vittau/Doom-Deck-Launcher
          Comment=Experimental DoomDeckLauncher builds for Steam Deck
          Description=Signed, self-hosted builds of DoomDeckLauncher. Runtimes come from Flathub.
          DefaultBranch=stable
          GPGKey=${public_key}
          EOF

          python3 scripts/flatpak/render-site.py \
            --output "$site" --version "$version" \
            --date "$(date -u +%Y-%m-%d)" \
            --app-id "$APP_ID" --site-base "$SITE_BASE"
          touch "$site/.nojekyll"

          # The published site carries only what we render here plus repo/.
          find "$site" -maxdepth 1 -type f \
            ! -name "index.html" ! -name ".nojekyll" \
            ! -name "${APP_ID}.flatpakref" ! -name "ddl.flatpakrepo" -delete

          echo "SITE_VERSION=$version" >> "$GITHUB_ENV"
          ls -la "$site"

      - name: Publish the site branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          git -C "$site" add --all
          if git -C "$site" diff --cached --quiet; then
            echo "Nothing changed since the last publication"
            exit 0
          fi
          git -C "$site" \
            -c user.name="ddl-flatpak-bot" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Publish ${APP_ID} ${SITE_VERSION}"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git -C "$site" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --quiet origin "$PAGES_BRANCH"
          echo "Published ${SITE_VERSION} to ${SITE_BASE}/"

      - name: Request a Pages build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A push made with GITHUB_TOKEN does not trigger a Pages build, so ask
          # for one explicitly through the documented REST endpoint. The token
          # needs the `pages: write` permission declared above.
          curl -fsS --max-time 20 -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" \
            | tee "$RUNNER_TEMP/pages-build.json"
          commit="$(git -C "$RUNNER_TEMP/site" rev-parse HEAD)"
          echo "PAGES_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "Requested a Pages build for $commit"

      - name: Wait for the Pages deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest"
          field() {
            python3 -c 'import json,sys; print(json.load(sys.stdin).get(sys.argv[1]) or "")' "$1"
          }
          for attempt in $(seq 1 48); do
            body="$(curl -fsS --max-time 20 \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "$api")"
            status="$(printf '%s' "$body" | field status)"
            commit="$(printf '%s' "$body" | field commit)"
            if [ "$commit" = "$PAGES_COMMIT" ] && [ "$status" = "built" ]; then
              echo "Pages built $commit"
              exit 0
            fi
            if [ "$commit" = "$PAGES_COMMIT" ] && [ "$status" = "errored" ]; then
              echo "::error::Pages build failed for $commit: $body"
              exit 1
            fi
            echo "Pages status for $PAGES_COMMIT: ${status:-unknown} (attempt $attempt)"
            sleep 10
          done
          echo "::error::Pages did not build $PAGES_COMMIT within 8 minutes"
          exit 1

      - name: Purge the Cloudflare cache prefix
        env:
          CLOUDFLARE_CACHE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_CACHE_PURGE_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          # One scoped prefix for the whole DDL tree (owner decision): never the
          # zone, another host or purge_everything. Missing both settings skip
          # the purge; a partial setup fails. The token is read from the
          # environment and is never printed.
          if [ -n "${CLOUDFLARE_CACHE_PURGE_TOKEN}" ] && [ -n "${CLOUDFLARE_ZONE_ID}" ]; then
            echo "PURGE_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "PURGE_CONFIGURED=false" >> "$GITHUB_ENV"
          fi
          python3 scripts/flatpak/purge_cloudflare_cache.py --site-url "${SITE_BASE}/"

      - name: Verify the published files
        run: |
          set -euo pipefail
          # shellcheck source=scripts/flatpak/served_urls.sh
          source scripts/flatpak/served_urls.sh
          # With a successful purge the canonical URLs must already be fresh, so
          # they are checked without a cache buster. Without purge credentials,
          # fall back to the cache-busting query used before.
          if [ "${PURGE_CONFIGURED:-false}" = "true" ]; then
            echo "Cloudflare purge configured: verifying canonical URLs"
            query=""
          else
            echo "Cloudflare purge not configured: verifying with a cache-busting query"
            query="?v=${PAGES_COMMIT:0:12}"
          fi
          mapfile -t urls < <(served_urls "$SITE_BASE" "$APP_ID" "$query")
          page_url="${urls[0]}"
          ref_url="${urls[1]}"
          summary_url="${urls[2]}"
          served=0
          for attempt in $(seq 1 12); do
            # Every artifact, including the landing page, must be served and
            # byte-identical to what this run rendered; a stale page is a
            # failure, never a green result.
            if curl -fsS --max-time 20 "$page_url" -o "$RUNNER_TEMP/published.index.html" \
               && curl -fsS --max-time 20 "$ref_url" -o "$RUNNER_TEMP/published.flatpakref" \
               && curl -fsS --max-time 20 "$summary_url" -o "$RUNNER_TEMP/published.summary" \
               && cmp -s "$RUNNER_TEMP/published.index.html" "$RUNNER_TEMP/site/index.html" \
               && cmp -s "$RUNNER_TEMP/published.summary" "$RUNNER_TEMP/site/repo/summary"; then
              served=1
              break
            fi
            echo "Published files are not current yet (attempt $attempt)..."
            sleep 10
          done
          if [ "$served" != 1 ]; then
            echo "::error::the served page, .flatpakref or repo/summary did not converge to the exported files"
            sha256sum "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/published.index.html" 2>/dev/null || true
            sha256sum "$RUNNER_TEMP/site/repo/summary" "$RUNNER_TEMP/published.summary" 2>/dev/null || true
            exit 1
          fi
          grep -Fx "Name=${APP_ID}" "$RUNNER_TEMP/published.flatpakref"
          grep -Fx "Url=${SITE_BASE}/repo/" "$RUNNER_TEMP/published.flatpakref"
          grep -q '^GPGKey=' "$RUNNER_TEMP/published.flatpakref"
          echo "Published page, descriptor and summary are served and consistent"

      - name: Write the job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Flatpak repository publication"
            echo
            echo "- App id: \`${APP_ID}\`"
            echo "- Requested ref: \`${{ inputs.ref || github.sha }}\`"
            echo "- Version: \`${SITE_VERSION:-unknown}\`"
            echo "- Site: ${SITE_BASE}/"
            echo "- Signing key: \`${GPG_FINGERPRINT:-not imported}\`"
            echo
            echo '```sh'
            echo "flatpak install --user --from ${SITE_BASE}/${APP_ID}.flatpakref"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ddl-flatpak-repo-log
          path: |
            ${{ runner.temp }}/flatpak-build.log
            ${{ runner.temp }}/sdk-info.txt
          if-no-files-found: warn
          retention-days: 14
