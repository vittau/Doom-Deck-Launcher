# Cargo workspace for DoomDeckLauncher (DDL).
#
# Layout follows decision D-005: `crates/ddl-core` holds pure logic with no UI
# dependencies, `crates/ddl` is the Slint binary named `ddl`.
[workspace]
resolver = "3"
members = ["crates/ddl-core", "crates/ddl"]

[workspace.package]
version = "0.0.6"
edition = "2024"
# Minimum supported Rust version. Kept in lockstep with the exact toolchain in
# `rust-toolchain.toml` so the two can never disagree.
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/vittau/Doom-Deck-Launcher"
authors = ["The DoomDeckLauncher contributors"]

# All third-party versions are pinned with `=` so a `Cargo.lock` refresh can
# never silently pull a different release than the one that was reviewed.
[workspace.dependencies]
# Declarative native UI. Used under its GPLv3 option (decision D-001); no
# Slint attribution badge is required.
slint = { version = "=1.18.1", default-features = false, features = [
    "compat-1-18",
    "std",
    "backend-winit",
    "renderer-femtovg",
    # Also compile the CPU renderer: it is the fallback on machines without a
    # usable GL/EGL stack (SLINT_BACKEND=winit-software) and the renderer the
    # headless UI test uses. See docs/research/steam-runtime-build.md.
    "renderer-software",
] }
# Build-time .slint -> Rust compiler, invoked from `crates/ddl/build.rs`.
slint-build = "=1.18.1"
# Native controller events; D-018 / spec 008.
gilrs = "=0.11.2"
# Structured diagnostics (spec 001, R5).
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"

# Catalog schema, URL/range validation and opt-in fetch lint (spec 002), downloads and
# safe archive extraction (spec 006).
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
url = "=2.5.8"
semver = "=1.0.28"
# `ureq`: small **blocking** HTTP client with no async runtime; the UI runs downloads on a
# worker thread (spec 006 R1/R2). Only `rustls` is enabled (pure-Rust TLS with bundled
# webpki roots, no OpenSSL on the Deck). The fetcher follows redirects itself so it can
# re-check every target against the host allowlist.
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
# SHA-256 verification and content-addressed caching (specs 002, 006).
sha2 = "=0.11.1"
# ZIP reading: deflate only; stored entries always work and other methods are rejected
# by the extractor (spec 006 R4).
zip = { version = "=9.0.4", default-features = false, features = ["deflate", "deflate-flate2-zlib-rs"] }
# IWAD library (spec 007): JSON registry state, and SHA-1/MD5/CRC-32 to match the published
# IWAD identification tables (D-017); SHA-256 is always computed too (sha2 above).
serde_json = "=1.0.154"
# Gzip decoding for the /idgames inventory (`ls-laR.gz`, `fullsort.gz`, spec 050). Pure-Rust
# backend: no C toolchain or system zlib on the Deck, and it is already in the tree through
# `zip`'s deflate support.
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
sha1 = "=0.11.0"
md-5 = "=0.11.0"
crc32fast = "=1.5.2"
# Test-only temporary directories (specs 005, 007).
tempfile = "=3.27.0"

# Release binaries are built for Steam Deck; stripping debug info keeps the
# downloadable tarball small. Debug/release logs are unaffected.
[profile.release]
strip = true
