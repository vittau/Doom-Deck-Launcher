notes = "Confirmed archive/member identities, the embedded DEHACKED lump and the absence of a COMPLVL lump. Complevel boom from the authors' 'Boom compatible' release text; no gameplay test performed. Tags: cacowards = 2016 winner per https://www.doomworld.com/cacowards/2016/ (secondary evidence only: DoomWiki Cacowards 2016 via web search; doomworld.com and doomwiki.org return 403 to automated fetches, so the page was not read directly); classics = v1 released 2016-05-08 (v1.2 is 2023-03-16), over five years before this review (docs/research/reference-ancient-aliens.md); megawad = 32 maps, MAP01–MAP32. Not tagged community-projects (one author plus seven guest mappers). Widescreen status bar credit: doom_widehud by NightFright and contributors (GPL-3.0), https://github.com/NightFright2k19/doom_widehud."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, gameplay and audio.", "The canonical Doomworld page is Cloudflare-blocked from the research host, so facts come from the bundled release text and the /idgames archive mirror."]

