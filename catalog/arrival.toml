# Single continuous DOOM II mapset (MAP01–MAP10 plus secret MAP32, no UMAPINFO or COMPLVL).
# The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-c.md §1–§2", "Archive and member sizes/SHA-256; WAD lump inventory (PWAD, 11 map markers, embedded DEHACKED strings, Boom line special 271 sky transfers); author's release text read byte-for-byte", "DSDA-Doom v0.30.1 source: prboom2/src/p_spec.c P_SpawnVanillaExtras applies line specials 271/272 in every complevel"]
notes = "Confirmed package/member identities from three byte-identical mirrors, the eleven map markers MAP01–MAP10 and MAP32, the embedded DEHACKED lump (map names and story text only, despite the readme's 'Dehacked/BEX Patch: No' line) and no COMPLVL, MAPINFO or UMAPINFO lump. Complevel vanilla comes from the author's 'Advanced engine needed: Limit-removing' plus 'May Not Run With: Vanilla Doom' (limit-removing convention); the maps use Boom sky-transfer line specials 271, which DSDA-Doom applies in all complevels, so the vanilla level keeps the custom skies. Progression uses DSDA-Doom's hardcoded Doom II next-map table (legacy.c): after the custom MAP10 the run continues into the base IWAD's MAP11 unless the player quits. Tags: cacowards = 2021 Top Twelve (page 3) winner, https://www.doomworld.com/cacowards/2021/best3/ (read through the Wayback capture of 2021-12-10); classics = released 2021-04-16, over five years before this review, with that Cacowards recognition. The Cacowards blurb says '9 maps'; the readme and the WAD itself count eleven slots, so the <=9-map episode tag is not claimed. Needs Deck Validation: IWAD/complevel, DEHACKED application, gameplay, audio, MAP32 access and the post-MAP10 transition."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, DEHACKED application, gameplay, audio and map selection.", "The Cacowards 2021 entry describes '9 maps' while the release declares 11 slots (9 main, 1 ending, secret MAP32); confirm MAP10 and MAP32 progression on the Deck.", "No UMAPINFO or COMPLVL exists. The hardcoded Doom II progression continues from the custom MAP10 into the base IWAD's MAP11; quit from the intermission to stop after the ending map.", "No separate DEHACKED member exists: the patch is embedded in arrival.wad and its hash is covered by the member identity."]

