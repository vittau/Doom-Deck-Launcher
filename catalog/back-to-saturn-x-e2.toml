# Single continuous DOOM II mapset (MAP01–MAP27, MAP31, no UMAPINFO). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-16"
engine_version = "0.30.1"
inspected = ["docs/research/reference-back-to-saturn-x-e2.md §1–§7", "Archive, member and WAD lump inspection; DSDA-Doom v0.30.1 source; authors' release text", "Cacowards 2014 winner: https://www.doomworld.com/cacowards/2014/"]
notes = "Confirmed archive/member identities, the embedded DEHACKED lump and the absence of a COMPLVL lump. Complevel vanilla is the authors' explicit value ('PRBOOM USERS USE COMPLEVEL 2 OR MAP20 WILL BREAK'); no gameplay test performed. Tags: classics = release 1.0.1 dated 2020-08-13, over five years before this review; community-projects = release text credits \"Esselfortium and a lot of wonderful people\" (docs/research/reference-back-to-saturn-x-e2.md, Confirmed quoted). cacowards = 2014 winner per https://www.doomworld.com/cacowards/2014/ (the 21st Annual Cacowards; secondary evidence only: DoomWiki's Back to Saturn X page says each of the first two episodes received a Cacoward, E1 in 2013 and E2 in 2014, and DoomWiki's Cacowards 2014 lists Back to Saturn X: Episode 2 among the winners, read via web search; doomworld.com and doomwiki.org return 403 to automated fetches, so the pages were not read directly and the specific best-of page was not identified; the award was for the 2014 beta of this episode, this recipe ships 1.0.1). Not tagged megawad or episode: 27 levels (map slots MAP01–MAP27 and MAP31) is under 30 and over 9. Widescreen status bar credit: doom_widehud by NightFright and contributors (GPL-3.0), https://github.com/NightFright2k19/doom_widehud."
limitations = ["Needs Deck Validation: IWAD/complevel, two-WAD load order, gameplay and audio.", "The canonical Doomworld page is Cloudflare-blocked from the research host, so facts come from the bundled release text and the /idgames archive mirror.", "The bundled map20_for_old_ports.zip is a genuine official component but is deliberately not offered: it is documented for old Boom/ZDoom-derived ports and is NOT vanilla compatible, and DSDA-Doom with complevel 2 does not need it.", "The separate btsx_e2.deh is for vanilla/Chocolate Doom and is intentionally not loaded: DSDA-Doom reads the embedded DEHACKED lump of btsx_e2a.wad."]

