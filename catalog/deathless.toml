[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-b.md §7",
  "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)",
  "deathless.wad lump directory read as data: 700 lumps, 36 map markers E1M1–E4M9, one 2,131-byte embedded DEHACKED lump, ZMAPINFO/EMAPINFO/DECORATE lumps, no COMPLVL or UMAPINFO lump",
  "deathless1.1.txt release text: version 1.1 dated 25 May 2020, Game: The Ultimate Doom, New levels E1M1-M9 through E4M1-M9, 'Advanced engine needed: Limit-removing', vanilla/Chocolate Doom explicitly unsupported, DEHACKED changes to lost soul and spiderdemon, no external patch file shipped",
]
notes = "Confirmed archive/member identities and source inspection. The WAD embeds its own DEHACKED patch, which DSDA-Doom applies to explicitly loaded PWADs even under -noautoload, so the recipe does not add a separate -deh argument; the archive ships no external patch. Complevel vanilla (3 on Ultimate Doom) follows the author's statement that the set needs a limit-removing engine while remaining a Doom-format mapset; that is the limit-removing convention. The bundled ZMAPINFO/EMAPINFO/DECORATE exist for GZDoom-family ports and are not read by DSDA-Doom. No gameplay test performed. Tags: classics = released 2020-05-25, over five years old, with the author's credited inclusion as an official DOOM + DOOM II add-on as lasting recognition (deathless1.1.txt, corroborated by https://bethesda.net/en-US/news/add-ons-for-doom-doom-ii-2022); megawad = 36 maps counted from the WAD and the author's map list. Not tagged cacowards: no award could be confirmed for this release, so the claim is not made."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, gameplay, audio and episode/map selection.",
  "The embedded DeHackEd patch changes monster balance (lost soul 70 HP, spiderdemon 3,500 HP with altered speed and pain chance); its actual feel in DSDA-Doom was not played and needs Deck validation.",
  "The author recommends Crispy Doom for the intended experience and notes the difficulty is deliberately easy early on; DDL runs DSDA-Doom, so parity is unverified.",
  "No screenshot bundled: no source under the contribution rules provided a compliant in-game image, so the painted fallback applies.",
]

