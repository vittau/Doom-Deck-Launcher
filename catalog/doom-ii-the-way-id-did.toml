variants = ["doom2-1.9", "doom2-1.9-kex-2024-08-06", "doom2-1.9-kex-2024-10-01"]

[compatibility]
family = "vanilla"
complevel = "vanilla"

[compatibility.engine]
range = "=0.30.1"
status = "inspected"

[compatibility.runtime]
# Single continuous DOOM II mapset (MAP01–MAP32). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-b.md §13–§18",
  "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)",
  "D2TWID.wad lump directory read as data: 732 lumps, 33 map markers MAP01–MAP33 with complete map lumps, one 6,384-byte embedded DEHACKED lump, MAPINFO/ZMAPINFO/EMAPINFO lumps, no COMPLVL or UMAPINFO lump",
  "D2TWID.txt release text: 32 new levels, Game: Doom 2, Map #: MAP01-MAP32, Doom 2 prior to 1.9 excluded, MAP33 absent from the authors' map list",
  "D2TWID.deh (7,272 bytes) compared with the WAD's embedded DEHACKED (6,384 bytes, WhackEd4): the embedded BEX [STRINGS]/[PARS] patch is the newer form and names MAP33",
]
notes = "Confirmed archive/member identities and source inspection. The WAD embeds its own DEHACKED patch, so the recipe does not add a separate -deh argument; the older external D2TWID.deh would re-apply superseded level names. Complevel vanilla (2 on Doom II) follows the authors' Doom II 1.9 target and the absence of any source-port requirement; no gameplay test performed. Tags: cacowards = Doomworld's 2013 Cacowards (20th annual) Top Ten Page 1 winner, https://www.doomworld.com/cacowards/2013/, read through the Wayback Machine copy of the legacy /20years/ page on 2026-10-22 because the live site returns 403; classics = released 2013-11-07 and finalized 2013-12-22, over five years old, with that Cacoward as cited recognition; community-projects = ten credited level designers plus their managers; megawad = 32 credited maps, and 33 map markers counted from the WAD."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, gameplay, audio and map selection.",
  "MAP33 \"Hexsoil\" is not in the authors' 32-map list. The bundled MAPINFO/ZMAPINFO/EMAPINFO route it from MAP02's secret exit only in ZDoom, ZDaemon or Eternity; DSDA-Doom ignores those lumps and keeps vanilla MAP02 → MAP31 progression, so MAP33 reachability in DDL's launch needs Deck validation.",
  "No screenshot bundled: no source under the contribution rules provided a compliant in-game image, so the painted fallback applies.",
]

