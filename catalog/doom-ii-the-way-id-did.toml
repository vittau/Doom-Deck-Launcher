page = "https://www.doomworld.com/idgames/levels/doom2/megawads/d2twid"
description = "DOOM II megawad: 32 vanilla-format maps (MAP01–MAP32) plus a bonus MAP33, with a WAD-embedded DeHackEd patch for the level names and the Wolfenstein replacements."
permission = "Authors may NOT use the contents of this file as a base for modification or reuse. Redistribution is permitted provided D2TWID.txt travels with the file, unmodified and intact. DDL downloads the unmodified archive and keeps the bundled readme."
tags = ["classics", "cacowards", "community-projects", "megawad"]

[base_game]
game = "doom2"
