[base_game]
game = "doom"
# The readme says it may not run with Doom prior to 1.9. It replaces E1–E3 only,
# so registered Doom 1.9 and Ultimate Doom (including the KEX re-release) both work.
variants = [
  "doom-1.9",
  "doom-1.9ud",
  "doom-1.9ud-kex-2024-08-06",
  "doom-1.9ud-kex-2024-10-01",
]

[compatibility]
family = "vanilla"
complevel = "vanilla"

[compatibility.engine]
range = "=0.30.1"
status = "inspected"

[compatibility.runtime]
# Three episode replacements (E1M1–E3M9); the menu selects the episode, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-b.md §1–§3",
  "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)",
  "DTWID.wad lump directory read as data: 398 lumps, MAP markers E1M1–E3M9 (27 maps), one 1,286-byte embedded DEHACKED lump, no COMPLVL or UMAPINFO lump",
  "DTWID.txt release text: 27 new levels, Game: Doom, Map #: E1M1-E3M9, no external files required, Doom prior to 1.9 excluded",
  "DTWID.deh (2,047 bytes, 2011-12-11) compared with the WAD's embedded DEHACKED (1,286 bytes, published 2012-02-07): the embedded patch carries the revised BEX [STRINGS] names",
]
notes = "Confirmed archive/member identities and source inspection. The WAD embeds its own DEHACKED patch, which DSDA-Doom applies to explicitly loaded PWADs even under -noautoload, so the recipe does not add a separate -deh argument; the older external DTWID.deh would re-apply superseded level names and is therefore not declared. Complevel vanilla (3 on Doom/Ultimate Doom) follows the authors' vanilla Doom 1.9 target and the absence of any source-port requirement; no gameplay test performed. Tags: cacowards = Doomworld's 2012 Cacowards (19th annual) Top Ten Page 1 winner, https://www.doomworld.com/cacowards/2012/, read through the Wayback Machine copy of the legacy /19years/ page on 2026-10-22 because the live site returns 403; classics = released 2011-12-10, over five years old, with that Cacoward and the 2013 sequel as cited recognition; community-projects = 19 mappers and managers credited in DTWID.txt. Not tagged megawad: the release is 27 maps, below the 30-map definition, even though Cacowards prose loosely calls it a megaWAD. Not tagged episode: the release spans 27 maps, above the nine-map definition."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, gameplay, audio and episode selection.",
  "E4 is not replaced: with Ultimate Doom the original E4M1–E4M9 remain selectable and unchanged.",
  "An optional Mr. Freeze soundtrack was distributed separately from this archive (Cacowards prose only); it is not part of the inspected package and is not declared.",
]

