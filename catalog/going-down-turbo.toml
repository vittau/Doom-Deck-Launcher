[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-a.md §13–§16", "Archive, member, WAD lump, COMPLVL, UMAPINFO/MAPINFO and embedded DEHACKED inspection; gdturbo.txt; the DSDA-Doom run record; DSDA-Doom v0.30.1 source and release notes"]
notes = "Confirmed archive/member identities and 32 MAP01–MAP32 markers. The WAD carries a COMPLVL lump whose exact bytes are 'boom', a 4,359-byte UMAPINFO with 32 map entries, a 5,880-byte ZDoom MAPINFO (inert under DSDA-Doom v0.30.1) and an embedded DEHACKED lump (6,263 B); there is no external patch. The readme identifies this as the 2nd bug-fix to the existing gdturbo.wad, records '7/11/2024', and recommends Boom-compatible ports; DoomWiki (archived oldid=552476) records the first release on 2024-11-05, while the inspected ZIP's internal timestamps are 2025-06-23, so the exact bug-fix build is pinned by SHA-256 rather than by the ambiguous readme date. The author tested DSDA-Doom 0.28.2, so the recipe uses family boom, complevel boom (9). Tags: megawad = 32 maps per gdturbo.txt and the WAD; this 2024 edition has no Cacoward of its own (the 2014 original is the separate `going-down` recipe) and is under five years old, so neither cacowards nor classics is claimed."
limitations = ["Needs Deck Validation: IWAD selection, complevel, embedded DEHACKED application, UMAPINFO map names, load order, gameplay, audio and map selection.", "The author warns that some maps will not work with -nomonsters and that the release may not run with non-Boom ports; DDL does not pass -nomonsters.", "No performance claim is made; the author's own tested engine was DSDA-Doom 0.28.2."]

