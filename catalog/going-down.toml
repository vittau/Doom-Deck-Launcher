# Single continuous DOOM II mapset (MAP01–MAP32, no UMAPINFO). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-16"
engine_version = "0.30.1"
inspected = ["docs/research/reference-going-down.md §1–§8", "Archive, member and WAD lump inspection; DSDA-Doom v0.30.1 source; author's release text"]
notes = "Confirmed archive/member identities, the embedded DEHACKED lump and the inert ZDoom-style MAPINFO (removed from DSDA-Doom in v0.30.0); no COMPLVL or UMAPINFO lump. Complevel 9 is the author's own stated value; no gameplay test performed. Tags: classics = first complete release 2014-09-14, over five years before this review; megawad = 32 maps (gd.txt, docs/research/reference-going-down.md). DoomWiki links this release from its Cacowards 2014 page, but the award category could not be confirmed (doomworld.com blocks automated fetches), so it is not tagged cacowards. Widescreen status bar credit: doom_widehud by NightFright and contributors (GPL-3.0), https://github.com/NightFright2k19/doom_widehud; gd.wad replaces no status-bar lump, so the base-game Doom/Doom II bar is offered."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, DEHACKED application, gameplay, audio and map selection.", "The embedded ZDoom MAPINFO (music/cluster names) is inert under DSDA-Doom v0.30.1; confirm the in-game music selection on the Deck."]

