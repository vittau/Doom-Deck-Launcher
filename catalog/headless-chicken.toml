# Continuous DOOM II megawad (MAP01–MAP33) with five UMAPINFO episodes. The menu selects
# the episode and map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-c.md §6", "Archive and member sizes/SHA-256; WAD lump inventory (33 map markers MAP01–MAP33, COMPLVL 'boom', UMAPINFO with five episodes, embedded DEHACKED, ZDoom MAPINFO/EMAPINFO/DECORATE/ZSCRIPT/SNDINFO/LANGUAGE/GLDEFS extras); author's release text read byte-for-byte", "DSDA-Doom v0.30.1 prboom2/src/p_spec.c generalized-linedef dispatch and prboom2/src/dsda/mapinfo/ (legacy.c, u.c UMAPINFO, hexen.c)"]
notes = "Confirmed package/member identities from three byte-identical mirrors and the 33 map markers MAP01–MAP33. Complevel boom is the author's own requirement ('Boom (-complevel \"9\") or GZDoom/Zandro for extras'), the WAD ships a COMPLVL lump whose bytes are 'boom', and all 33 maps use Boom generalized line types (2,022 lines: 937 floor, 610 lift, 285 locked-door, 98 door, 92 ceiling), which vanilla compatibility does not implement. DSDA-Doom reads the UMAPINFO lump for the five episode titles, map names, music and the MAP31/MAP32/MAP33 secret returns (MAP30 ends with endcast). The ZDoom-syntax MAPINFO, Eternity EMAPINFO and GZDoom DECORATE/ZSCRIPT/SNDINFO/LANGUAGE/GLDEFS lumps are the author's 'extras' and are inert under DSDA-Doom v0.30.1. The embedded DEHACKED changes weapon timings, projectiles and map names. Tag: megawad = 33 maps, counted from the WAD and the readme. No Cacowards entry was found for this release in the researched inventory, so no cacowards tag is claimed. Needs Deck Validation: IWAD/complevel, DEHACKED application, UMAPINFO episode menu, gameplay, performance and audio."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, DEHACKED and UMAPINFO application, gameplay, audio and episode/map selection.", "The WAD is 126,358,308 B across 8,243 lumps with 33 large maps; no framerate, memory or battery measurement was made, and Deck performance is unverified.", "The ZDoom/GZDoom extras (DECORATE, ZSCRIPT, SNDINFO, LANGUAGE, GLDEFS, ZDoom MAPINFO) are inert under DSDA-Doom v0.30.1; confirm the intended look and sound on the Deck.", "The readme documents two release candidates (RC1 2023, RC13 2025) and the idgames file is dated 2026-02-02; this recipe pins the idgames bytes, not an evolving development build.", "No separate DEHACKED member exists: the patch is embedded in HDLSCHKN.wad and its hash is covered by the member identity."]

