# Continuous DOOM II megawad (MAP01–MAP32). The bundled MAPINFO is ZDoom format, which
# DSDA-Doom v0.30.1 ignores (removed in v0.30.0), so no episode list or warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-d.md §2 and §5",
  "Downloaded jpcp.zip from three byte-identical mirrors; 13,575,267 bytes, SHA-256 2d9d54a4…; ZIP central directory has JPCP.txt (13,271 B), JPCP.wad (45,520,073 B) and JPCP_HUD.wad (33,600 B)",
  "JPCP.wad: PWAD, 2,135 lumps, thirty-two map markers MAP01–MAP32, thirty-five D_* music lumps, one embedded DEHACKED lump and a ZDoom-format MAPINFO; no COMPLVL or UMAPINFO lump",
  "JPCP_HUD.wad: PWAD, 23 graphics lumps only (STBAR, STBAR000, STARMS, STTNUM0–9, WINUM0–9); no maps, DEHACKED, MAPINFO or music",
  "Authors' JPCP.txt: final version 2.3 dated 16/07/24, Map 01–Map 32, \"Advanced engine needed: Limit Removing\", \"Tested with PrBoom+ with doom 2 compatibility (-complevel 2)\", 13 credited level designers",
  "Cacowards 2016 Top Ten, page 3: https://www.doomworld.com/cacowards/2016/ (edition page read at https://web.archive.org/web/2026id_/https://www.doomworld.com/23years/best3.php; the page header reads \"Top Ten - Page 3\")",
  "Cacowards 2016 screenshot: https://web.archive.org/web/2026id_/https://www.doomworld.com/23years/images/jcp.png",
]
notes = "Confirmed archive and member identities from downloads on www.gamers.org, mirrors.lug.mtu.edu and ftp.fu-berlin.de that return identical size and SHA-256; nothing downloaded was extracted to disk or executed. The map WAD embeds its DEHACKED patch (level names and intermission text) and all thirty-five music lumps, so no separate -deh member or soundtrack package is needed. The archive's JPCP.txt is not valid UTF-8 (a CP932 ellipsis byte at offset 9,547); the recipe pins its exact bytes and the kept file is never edited. No COMPLVL lump exists: complevel vanilla follows D-030's limit-removing convention and agrees with the authors' own \"PrBoom+ with doom 2 compatibility (-complevel 2)\" test note, since vanilla resolves to 2 on Doom II. The ZDoom-format MAPINFO is inert in DSDA-Doom v0.30.1 (ZDoom MAPINFO support was removed in v0.30.0), so the set plays as one continuous 32-map run. The optional JPCP_HUD.wad is declared as an add-on that replaces status-bar numbers/arms with Katakana/Kanji graphics, off by default; its 23 lumps were enumerated and none affects gameplay. Tags: cacowards = 2016 Top Ten winner, page 3 (23rd Annual Cacowards; canonical year URL https://www.doomworld.com/cacowards/2016/); megawad = 32 maps, MAP01–MAP32; community-projects = multi-author Japanese community project with a credited leader, mappers and musicians; classics = released 2016-07-24, over five years before this review. No gameplay test was performed."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, DEHACKED application, gameplay, audio and map selection.",
  "ZDoom MAPINFO episode/par information is lost under DSDA-Doom v0.30.1; confirm the continuous MAP01–MAP32 run and the secret-map exits on the Deck.",
  "Needs Deck Validation: the optional JPCP_HUD.wad Katakana/Kanji status bar, including whether DSDA-Doom draws the replaced numbers and arms as intended.",
  "The bundled screenshot is a 1280x960 (4:3) Cacowards image, resized to 1066x800; confirm the card crop on the Deck.",
]

