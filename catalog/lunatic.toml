# Single five-map DOOM II episode (MAP01–MAP05). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-c.md §4", "Archive and member sizes/SHA-256; WAD lump inventory (five map markers MAP01–MAP05, ZDoom-syntax MAPINFO, Eternity EMAPINFO, embedded DEHACKED, Boom generalized and extended line specials); author's release text read byte-for-byte", "DSDA-Doom v0.30.1 prboom2/src/p_spec.c generalized-linedef dispatch and prboom2/src/dsda/mapinfo/ (legacy.c, u.c, hexen.c only — no ZDoom MAPINFO reader)"]
notes = "Confirmed package/member identities from three byte-identical mirrors and the five map markers MAP01–MAP05. Complevel boom: the author's text says 'Boom compatible, limit removing ports' and 'Lunatic includes 5 Boom-format maps', and the maps use Boom generalized line types that vanilla compatibility does not implement. The MAPINFO lump is ZDoom syntax and the EMAPINFO lump is Eternity's metadata format; neither is a Boom format, and DSDA-Doom v0.30.1 reads neither (its map metadata readers are the hardcoded legacy progression, UMAPINFO and Hexen). Progression therefore uses the hardcoded Doom II next-map table (legacy.c): after the custom MAP05 the run continues into the base IWAD's MAP06 unless the player quits. The embedded DEHACKED edits a Keen type, frames and level names. Tags: cacowards = 2011 Top Ten (page 1) winner, https://www.doomworld.com/cacowards/2011/ (the 2011 edition lives at https://www.doomworld.com/18years/best1.php, read through the Wayback capture of 2011-12-10); classics = released 2011-08-11, over five years before this review, with that Cacowards recognition; episode = five maps, counted from the WAD and the author's map list. Needs Deck Validation: IWAD/complevel, DEHACKED application, gameplay, audio and the post-MAP05 transition."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, DEHACKED application, gameplay, audio and map selection.", "The ZDoom MAPINFO and Eternity EMAPINFO lumps are inert in DSDA-Doom v0.30.1; map titles and the per-map music selection fall back to engine behaviour. Confirm what plays on the Deck.", "No UMAPINFO or COMPLVL exists. The MAPINFO's MAP05 next points at MAP06 (itself missing from the PWAD); the hardcoded Doom II progression therefore loads the base IWAD's MAP06. Quit from the intermission to stop after MAP05.", "No separate DEHACKED member exists: the patch is embedded in Lunatic.wad and its hash is covered by the member identity."]

