# Single continuous DOOM II mapset (MAP01–MAP32, no UMAPINFO). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-21"
engine_version = "0.30.1"
inspected = ["docs/research/reference-memento-mori.md §1–§8", "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)", "WAD lump directory read as data: 572 lumps, MAP01–MAP32, no DEHACKED, COMPLVL, UMAPINFO or MAPINFO lump; MM2MUS.WAD holds the 35 D_* music lumps", "MM2.BAT: \"doom2 -file mm2.wad mm2mus.wad\" (music WAD second)", "MM2.TXT: Doom 2 add-on, mission briefings, musical score credits and copyright section quoted in the recipe permission field"]
notes = "Confirmed archive/member identities (exact size and SHA-256) by downloading the archive from four allowlisted idgames mirrors and reading its member list; nothing from the archive was executed. The bundled readme and its MM2.BAT launcher both start Doom II with mm2.wad then mm2mus.wad, so the music WAD is the second member of the required main component and loads after the maps. No DEHACKED, COMPLVL or UMAPINFO lump exists, so complevel vanilla (2 on Doom II) is declared by the recipe from the release's Doom II target. No gameplay test was performed. Tags: classics = released 1996-07-27 and listed second in Doomworld's Top 100 WADs of All Time 1996 feature per DoomWiki (secondary, doomworld.com 403s from this host); community-projects = 23 credited map authors plus two composers; megawad = 32 maps. Not tagged cacowards: that feature began in 2004 and no Cacoward exists for this release. No screenshot: the archive ships text-only credits and no verifiable licensed in-game image was found. The top-secret outtake levels live in the separate DOS infopack mm2info.zip, not in this archive, so they are out of scope."
limitations = ["Needs Deck Validation: IWAD/complevel, load order (maps then music), gameplay, audio and map selection.", "The MM2MUS.WAD soundtrack may not be extracted or reproduced; DDL only loads the unmodified WAD from the official archive."]

