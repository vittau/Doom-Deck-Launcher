# Single continuous DOOM II mapset (MAP01–MAP32, no UMAPINFO). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-21"
engine_version = "0.30.1"
inspected = ["docs/research/reference-memento-mori.md §1–§8", "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)", "WAD lump directory read as data: 450 lumps, MAP01–MAP32, no DEHACKED, COMPLVL, UMAPINFO or MAPINFO lump; MMMUS.WAD holds the 35 D_* music lumps", "MMHELP.TXT Q4: \"doom2 -file mm.wad mmmus.wad\" (music WAD second)", "MMHELP.TXT Q1/Q6 and MM.TXT: Doom II, version 1.9 needed", "MM.TXT copyright section quoted in the recipe permission field"]
notes = "Confirmed archive/member identities (exact size and SHA-256) by downloading the archive from four allowlisted idgames mirrors and reading its member list; nothing from the archive was executed. The bundled help file prescribes \"doom2 -file mm.wad mmmus.wad\", so the music WAD is the second member of the required main component and loads after the map WAD, matching the authors' default. No DEHACKED, COMPLVL or UMAPINFO lump exists, so complevel vanilla (2 on Doom II) comes from the authors' Doom II v1.9 target and must be declared by the recipe. No gameplay test was performed. Tags: classics = first released 1995-12-10 and named in Doomworld's Top 100 WADs of All Time 1996 feature per DoomWiki (secondary, doomworld.com 403s from this host); community-projects = 21 map authors credited in AUTHORS.TXT; megawad = 32 maps. Not tagged cacowards: that feature began in 2004 and no Cacoward exists for this release."
limitations = ["Needs Deck Validation: IWAD/complevel, load order (maps then music), gameplay, audio and map selection."]

