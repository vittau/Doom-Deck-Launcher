pistol_start = true

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-c.md §7", "Archive and member sizes/SHA-256; WAD lump inventory (19 map markers MAP01–MAP17 and MAP31/MAP32, UMAPINFO with per-map titles/authors/par times and a MAP17 endgame, embedded DEHACKED, ZDoom ZMAPINFO and DECORATE extras); author's release text read byte-for-byte", "DSDA-Doom v0.30.1 prboom2/src/p_spec.c generalized-linedef dispatch and prboom2/src/dsda/mapinfo/u.c (UMAPINFO)"]
notes = "Confirmed package/member identities from three byte-identical mirrors and the nineteen map markers MAP01–MAP17, MAP31 and MAP32 (the description says '18 maps'; the slot list and the WAD have nineteen). Complevel boom is the author's own statement ('Target format: PRBoom+ complevel 9', tested on DSDA 0.29.4), and 18 of the 19 maps use Boom generalized line types (1,002 lines: 595 floor, 307 ceiling, 56 lift, 30 locked-door, 14 door). DSDA-Doom reads the UMAPINFO for map names, per-map authors, par times and the MAP17 endgame flag; MAP31/MAP32 return to MAP16. The ZDoom ZMAPINFO and DECORATE lumps are inert under DSDA-Doom v0.30.1. The embedded DEHACKED is covered by the WAD hash. Tag: community-projects = fifteen credited mappers led by Bauul, per the readme's map credits and UMAPINFO author fields. No megawad (19 slots) and no episode (more than nine) tag. No Cacowards entry was found for this release in the researched inventory, so no cacowards tag is claimed. Needs Deck Validation: IWAD/complevel, UMAPINFO application, pistol-start profile, gameplay and performance."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, DEHACKED and UMAPINFO application, gameplay, audio and map selection.", "Slaughter combat with 300-second par times: no framerate, memory or battery measurement was made, and Deck performance is unverified.", "The author documents that co-op may soft-lock; single-player is the designed mode and co-op was not tested here.", "The readme says '18 maps' while the slot list and the WAD have 19 (MAP01–MAP17, MAP31, MAP32); the MAP17 epilogue is a credits tour with an endgame flag.", "The ZDoom ZMAPINFO and DECORATE lumps are inert under DSDA-Doom v0.30.1; confirm the intended presentation on the Deck."]

