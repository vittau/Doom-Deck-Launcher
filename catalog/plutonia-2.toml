# Single continuous Plutonia mapset (MAP01–MAP32, no UMAPINFO). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-a.md §5–§8", "Archive, member, WAD lump, MAPINFO, embedded DEHACKED and external PL2.DEH inspection; PL2.TXT and PL2INFO.TXT; DSDA-Doom v0.30.1 source and release notes"]
notes = "Confirmed archive/member identities and the base game: PL2INFO.TXT says to use PLUTONIA.WAD as the IWAD and that DOOM2.WAD causes errors. The WAD has MAP01–MAP32 plus a MAP33 bonus defined only in ZDoom MAPINFO, and an embedded DEHACKED lump. Complevel vanilla follows the release's DOOM2.EXE target, 'should run with any Doom engine' and the manual's 'vanilla form with Chocolate Doom' statement; the vanilla alias resolves to 4 on Plutonia (D-030). The external PL2.DEH (7,359 B) differs from the embedded lump (7,357 B) in one level name and one Text length; the embedded lumps match the MAPINFO/manual 'Emerald Eve', are applied automatically by DSDA-Doom, and the recipe does not load the external file twice. Tags: cacowards = 2009 Cacowards Top Ten winner and Mordeth Award, https://www.doomworld.com/cacowards/2009/ (page not read live in this session; archived inventory docs/research/cacowards.md §2009); megawad = 32 maps per PL2.TXT, with MAP33 reachable only through ZDoom MAPINFO; classics = released 2008-12-31, over five years before this review, with the Cacowards as lasting recognition; community-projects = the credited Plutonia 2 team listed in PL2INFO.TXT §6.1."
limitations = ["Needs Deck Validation: Plutonia IWAD selection, complevel, embedded DEHACKED application, load order, gameplay, audio and map selection.", "MAP33 'Chocolate' is defined only in the ZDoom MAPINFO lump; DSDA-Doom removed ZDoom MAPINFO support in v0.30.0, so the bonus map is not reachable without a separate UMAPINFO (not supplied by the release).", "The external PL2.DEH is deliberately not declared; confirm on the Deck that the WAD's embedded DEHACKED level names and story text appear."]

