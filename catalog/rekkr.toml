status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-b.md §9",
  "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)",
  "REKKR.wad lump directory read as data: 3,330 lumps, 36 map markers E1M1–E4M9, one 61,321-byte embedded DEHACKED lump, MAPINFO 5,036 and DECORATE 1,204 for GZDoom-family ports, no COMPLVL or UMAPINFO lump",
  "The embedded DEHACKED lump is byte-identical to the archive's external REKKR.deh (same 61,321 bytes and SHA-256), so no separate -deh load is declared",
  "REKKR.txt: 'a total conversion for Ultimate Doom v1.9', 36 new levels, Game: Doom, Map #: All, Advanced engine needed: None, Other files required: None, tested with Chocolate Doom, GZDoom, Zandronum, PRBoom(+) and Eternity",
  "REK_CREDS.txt: per-map and per-resource credits, used for the author list; REKKR.txt carries the CC BY-NC 4.0 terms",
]
notes = "Confirmed archive/member identities and source inspection. This is the original free PWAD edition from /idgames, not the standalone IWAD or paid Sunken Land release: the readme requires no other files and the WAD is a PWAD over the player's Ultimate Doom IWAD, which DDL never bundles or downloads. The WAD embeds its DEHACKED patch and the archive's external REKKR.deh is byte-identical, so the recipe loads only the map WAD under DSDA-Doom's automatic embedded-patch handling. Complevel vanilla (3 on Ultimate Doom) follows the author's 'Advanced engine needed: None' statement and the Chocolate Doom test credit; no gameplay test performed. Tags: cacowards = 2018 Cacowards Top Ten Page 2 winner, https://www.doomworld.com/cacowards/2018/, read through the Wayback Machine on 2026-10-22 because the live site returns 403 (the same feature names Revae Creator of the Year); classics = first released 2018-07-09, over five years old, with that Cacoward as cited recognition; community-projects = nine credited mappers plus music, sounds and testing contributors; megawad = 36 maps counted from the WAD and the author's list."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, gameplay, audio and episode/map selection.",
  "REKKR is a total conversion: DSDA-Doom must apply the embedded DeHackEd patch (new monsters, weapons and strings) for the game to behave as intended; the visible result was not played on Deck.",
  "The free PWAD edition is the only edition declared; the standalone IWAD and paid Sunken Land releases are out of scope and are not downloaded.",
  "No screenshot bundled: the official site is behind a bot challenge and no compliant in-game image was obtainable, so the painted fallback applies.",
]

