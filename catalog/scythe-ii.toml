[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-a.md §1–§4", "Archive, member, WAD lump and embedded DEHACKED inspection; authors' scythe2.txt; DSDA-Doom v0.30.1 source and release notes"]
notes = "Confirmed archive/member identities, 32 MAP01–MAP32 markers, the embedded DEHACKED lump (5,812 B) and the absence of COMPLVL, UMAPINFO and MAPINFO lumps. Complevel vanilla follows the author's 'Any limit removing port' / 'compatible with pure limit removing ports' statement and the limit-removing convention; no gameplay test was performed. Tags: cacowards = 2005 Cacowards Top Ten winner, https://www.doomworld.com/cacowards/2005/ (page not read live in this session; archived inventory docs/research/cacowards.md §2005); megawad = 32 maps per scythe2.txt and the WAD; classics = released 2005-06-07, over five years before this review, with the Cacoward as lasting recognition; challenging = the author writes 'This wad is harder than the original Scythe' and 'Shortly after map20, you WILL run into trouble on skill 4'."
limitations = ["Needs Deck Validation: Doom II IWAD selection, complevel, embedded DEHACKED application, load order, gameplay, audio and map selection.", "The six author-labelled episodes have no UMAPINFO or MAPINFO, so DSDA-Doom starts one continuous 32-map run; confirm the intended map progression on the Deck."]

