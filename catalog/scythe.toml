inspected = ["docs/research/reference-scythe.md §1–§8", "Archive, member and WAD lump inspection; DSDA-Doom v0.30.1 source; authors' release text"]
notes = "Confirmed archive/member identities and the absence of COMPLVL, DEHACKED and UMAPINFO/MAPINFO lumps. Proposed complevel 2 from the authors' 'runs with doom2.exe v1.9' statement; no gameplay test performed. Tags: classics = released 2003-04-08, over five years before this review, and named on Doomworld's 2003 top-WADs list per DoomWiki (secondary); megawad = 32 maps (docs/research/reference-scythe.md). No Cacoward found for this original release (its sequel Scythe 2 won in 2005), so it is not tagged cacowards. Widescreen status bar credit: doom_widehud by NightFright and contributors (GPL-3.0), https://github.com/NightFright2k19/doom_widehud; SCYTHE.WAD replaces no status-bar lump, so the base-game Doom/Doom II bar is offered."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, gameplay, audio and map selection."]

