[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-16"
engine_version = "0.30.1"
inspected = ["docs/research/reference-sigil.md §1–§5", "Archive sizes and SHA-256; WAD lump listings; DSDA-Doom v0.30.1 source", "Cacowards 2019 runner-up: https://www.doomworld.com/cacowards/2019/", "Owner-supplied SIGIL USB image V1.23 inspected read-only 2026-10-21: docs/research/reference-sigil.md §2.1 and docs/reports/068-sigil-purchased-editions.md"]
notes = "Confirmed archive/member identities and source inspection. The owner-supplied paid v1.23 USB image confirms SIGIL_V1_23_REG.wad is a complete 146-lump E5M1–E5M9 mapset carrying 11 Buckethead MP3 lumps; every non-music lump is byte-identical to the free WAD, so it replaces rather than augments it. SIGIL_SHREDS_COMPAT.wad is an 11-lump music-only add-on for the E3 compat path; the recipe models it as a paid imported component that requires the free compat maps and loads after them, never as a native E5 replacement. Complevel vanilla; no gameplay or audio test performed. Tags: cacowards = 2019 runner-up per https://www.doomworld.com/cacowards/2019/ (secondary evidence only: DoomWiki Cacowards 2019 via web search; doomworld.com blocks automated fetches, so the page was not read directly); classics = first free release 2019-05-01, over five years before this review; episode = nine maps E5M1–E5M9 (docs/research/reference-sigil.md); featured = D-010 reference recipe. Widescreen status bar credit: doom_widehud by NightFright and contributors (GPL-3.0), https://github.com/NightFright2k19/doom_widehud; SIGIL_V1_23.wad replaces no status-bar lump, so the base-game Doom/Doom II bar is offered."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, gameplay, audio and episode menu.", "SIGIL_V1_23_REG.wad MP3 playback is supported by DSDA-Doom v0.30.1's SDL_mixer path per source inspection but was not played; remains Needs Deck Validation.", "SIGIL_SHREDS_COMPAT.wad is music-only and is valid only after SIGIL_COMPAT_V1_23.wad; it is not needed on DSDA-Doom's native E5 path and is never a complete E5 replacement."]

