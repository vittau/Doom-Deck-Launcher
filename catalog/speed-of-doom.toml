# Single continuous DOOM II mapset (MAP01–MAP33, no UMAPINFO). The menu selects the map, so no warp is prescribed.

[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-a.md §21–§24", "Archive, member, WAD lump, MAPINFO and embedded DEHACKED inspection; SODFINAL.txt and SODINFO.txt; DSDA-Doom v0.30.1 source and release notes"]
notes = "Confirmed archive/member identities and 33 MAP01–MAP33 markers: 32 main maps plus the MAP33 bonus 'Descent to Nowhere' listed in SODINFO.txt §4.1. The WAD carries an embedded 3,412-byte DEHACKED lump, 35 D_* music lumps and a 6,487-byte ZDoom MAPINFO that is inert under DSDA-Doom v0.30.1; there is no COMPLVL, UMAPINFO or external patch. SODFINAL.txt says 'Advanced engine needed: Boom Compatible Ports' and 'Game: Doom 2', so family boom and complevel boom (9) follow the author and the Boom convention. Tags: cacowards = 2010 Cacowards Top Ten winner, https://www.doomworld.com/cacowards/2010/ (page not read live in this session; archived inventory docs/research/cacowards.md §2010); megawad = 33 maps; classics = released 2010-03-28, over five years before this review, with the Cacoward as lasting recognition; challenging = the readme says '33 challenging maps of a megawad' and SODINFO says 'Difficulty is not suited for the faint of hearts' and recommends skill 2/3 for most doomers."
limitations = ["Needs Deck Validation: IWAD selection, complevel, embedded DEHACKED application, load order, gameplay, audio and map selection.", "SODINFO.txt warns that the WAD will crash on several maps under BOOM or MBF and recommends PrBoom-plus; DSDA-Doom is PrBoom-derived, but the release's stated crash risk and map lag still need Deck validation.", "The ZDoom MAPINFO is inert under DSDA-Doom v0.30.1, so its episode/cluster presentation is lost; confirm map progression and audio on the Deck."]

