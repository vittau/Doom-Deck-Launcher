engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-b.md §25–§31",
  "Package and member paths, sizes and SHA-256 computed from the downloaded archive (nothing executed)",
  "Sunder 2407.wad lump directory read as data: 2,530 lumps, 22 map markers MAP01–MAP20 plus MAP31/MAP32, one 6,734-byte embedded DEHACKED lump (WhackEd4 BETA) naming every map and defining the Hive Mother, a ZDoom-format MAPINFO lump, no COMPLVL or UMAPINFO lump",
  "SunderReadMeV2.TXT: 'For DOOM II', 'should work in any Boom compatible port', 'extremely difficult maps', 'Map #: Map 01 - Map 19 (+ 31 & 32)', 'Map 15 is extremely system intensive. Map 32 might also cause slow down on older machines', 'Date Finished: It's not. Still mapping!'",
  "Readme Map Notes: an author-reported GZDoom software-mode drop to '6 - 8 FPS in one especially bad section' of MAP15 (author measurement, not a Deck measurement)",
]
notes = "Confirmed archive/member identities and source inspection. The selected release is V.2407, the author's Dropbox-hosted public build linked as 'Sunder V.2407' from the project's Doomworld thread; the newer V.2512 announcement (2025-10-02, adding MAP21) points at a OneDrive link, which the current download allowlist does not cover, so it is deliberately not substituted and host policy was not changed. The readme header still says 'Map 01 - Map 19 (+31 & 32)' while the WAD bytes contain MAP20 as well; the recipe describes the inspected 22-slot scope and the readme's Map 20 section. The WAD embeds its DEHACKED patch, so the recipe adds no separate -deh argument; the bundled MAPINFO is ZDoom-format and is not read by DSDA-Doom. Complevel boom (9) comes from the author's 'should work in any Boom compatible port' statement and the Boom-compatible feature set; no gameplay test performed. Tags: classics = first released 2009-04-20, over five years old, and featured in Doomworld's 2018 Top 25 Missed Cacowards as an influential slaughter release (DoomWiki, read through the Wayback Machine); challenging = the author calls the set 'extremely difficult maps' and it is a slaughter mapset. Not tagged megawad: the pinned release has 22 maps, below the 30-map definition. Not tagged cacowards: the Top 25 Missed Cacowards feature is not a winner or runner-up award."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, gameplay and map selection.",
  "Performance is unmeasured on Deck: the author reports MAP15 as 'extremely system intensive' and MAP32 as a possible slowdown on older machines, with a GZDoom software-mode 6-8 FPS section in MAP15. No Steam Deck FPS or battery figure is claimed.",
  "The pinned V.2407 build is not the author's newest V.2512 (2025-10-02), which adds MAP21 through a OneDrive link outside the current download allowlist; scope is 22 maps, not the 23 maps of the newest build.",
  "The readme's own map-count line is stale (says Map 01-19 + 31/32) although MAP20 is present and documented in its Map 20 section.",
  "No screenshot bundled: no source under the contribution rules provided a compliant in-game image, so the painted fallback applies.",
]

