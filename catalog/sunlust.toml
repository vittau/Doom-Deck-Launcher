[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-16"
engine_version = "0.30.1"
inspected = ["docs/research/reference-sunlust.md §1–§7", "Archive, member and WAD lump inspection; DSDA-Doom v0.30.1 source; authors' release text", "Cacowards 2015 winner: https://www.doomworld.com/cacowards/2015/"]
notes = "Confirmed archive/member identities, the embedded DEHACKED lump and the absence of a COMPLVL lump. Proposed complevel 9 (Boom) from the authors' 'Boom-compatible' release text; no gameplay test performed. Tags: cacowards = 2015 winner per https://www.doomworld.com/cacowards/2015/ (secondary evidence only: DoomWiki Cacowards 2015 via web search; doomworld.com and doomwiki.org return 403 to automated fetches, so the page was not read directly); classics = first released 2015-08-07, over five years before this review; megawad = 32 maps, MAP01–MAP32 (docs/research/reference-sunlust.md). Not tagged community-projects (two credited authors)."
limitations = ["Needs Deck Validation: IWAD/complevel, load order, gameplay and audio.", "The canonical Doomworld page and forum thread are Cloudflare-blocked from the research host, so facts come from the bundled release text and the /idgames archive mirror."]

