description = "DOOM II: 32 Boom-compatible maps (MAP01–MAP32) designed for pistol start, with bundled MIDI music, graphics and an embedded DEHACKED patch."
permission = "Redistribution permitted with the bundled permission text intact and unmodified; the authors do not permit reuse of the contents as a base for modification. DDL downloads the unmodified archive from its canonical /idgames source and keeps the bundled text files unedited. See the kept text members for the full terms and resource credits."
