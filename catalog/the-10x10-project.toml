[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-a.md §17–§20", "Archive, member, WAD lump, UMAPINFO and embedded DEHACKED inspection; 10x10/10x10.txt; coordinator-provided DoomWiki oldid=576470 identity; DSDA-Doom v0.30.1 source and release notes"]
notes = "Confirmed archive/member identities. The WAD has twelve map markers — MAP01–MAP10, the no-exit stopper MAP11 and the secret MAP31 — matching the readme's '11 (+1 no-exit stopper)' and the coordinator-provided DoomWiki page (12 map slots including ending and secret). It carries a 1,509-byte UMAPINFO, an embedded 490-byte DEHACKED [STRINGS] patch and 13 D_* music lumps, with no COMPLVL and no separate music WAD. The readme says Boom-compatible and tested DSDA-Doom 0.21.3, so family boom and complevel boom (9) follow the author and the Boom convention. Tags: cacowards = 2022 Cacowards Top Ten winner, https://www.doomworld.com/cacowards/2022/ (page not read live in this session; archived inventory docs/research/cacowards.md §2022). megawad is not claimed (12 map slots is under 30), episode is not claimed (12 is over the nine-map limit), and classics is not claimed (2022 is under five years old). The author says pistol starts are intended, so the recipe sets the typed player-profile suggestion."
limitations = ["Needs Deck Validation: IWAD selection, complevel, UMAPINFO progression, embedded DEHACKED strings, load order, gameplay, audio and map selection.", "MAP11 'No Exit, It's Over' is a no-exit stopper (its UMAPINFO 'next' target MAP12 does not exist) and MAP31 'The Anna Dream' is the secret map; confirm the intended end and secret route on the Deck.", "The author's DoomWiki oldid=576470 page could not be read directly from this host (Cloudflare HTTP 403); its identity facts came from the coordinator's reading, while the archive/readme facts were inspected here."]

