page = "https://www.doomworld.com/idgames/levels/doom2/megawads/tntr"
description = "A 32-map community sequel to TNT: Evilution that carries the fight from an Io thermal power station to a demonic fleet, with custom music, graphics and sounds."
permission = "Authors may use the contents as a base for modification or reuse, and the team states it obtained permission from the original authors of any modified or included resources. Redistribution is permitted provided TNTR.txt travels with the file, unmodified and intact. DDL downloads the unmodified archive and keeps the bundled credits file."
