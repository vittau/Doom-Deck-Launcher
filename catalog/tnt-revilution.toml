[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = ["docs/research/reference-087-a.md §9–§12", "Archive, member, WAD lump, MAPINFO, embedded DEHACKED and external TNTR.deh inspection; TNTR.txt; DSDA-Doom v0.30.1 source and release notes"]
notes = "Confirmed archive/member identities and the base game: TNTR.txt declares 'Game: TNT', so the recipe requires a TNT IWAD and must not infer Doom II from its idgames directory. TNTR.WAD has MAP01–MAP32 and an embedded DEHACKED/BEX patch (8,218 B) with its custom things, frames, codepointers, par times and strings; the external TNTR.deh (10,372 B) is the same information in plain DeHackEd form for engines without embedded support and is not loaded twice. Complevel vanilla follows 'Advanced engine needed: No. For Demos use TNT.wad', the Chocolate Doom test and the vanilla target; the vanilla alias resolves to 4 on TNT (D-030). Tags: cacowards = 2017 Cacowards runner-up, https://www.doomworld.com/cacowards/2017/ (page not read live in this session; archived inventory docs/research/cacowards.md §2017); megawad = 32 maps per TNTR.txt and the WAD; classics = released 2017-05-29, over five years before this review, with the Cacoward as lasting recognition; community-projects = the credited team and map authors in TNTR.txt."
limitations = ["Needs Deck Validation: TNT IWAD selection, complevel, embedded DEHACKED application, load order, gameplay, audio and map selection.", "The external TNTR.deh is deliberately not declared; confirm on the Deck that the WAD's embedded DEHACKED level names and custom monsters appear.", "TNTR.txt warns of vanilla visplane crashes from Arch-Vile blasts on MAP16 and MAP22, savegame overflows on several maps, and a MAP30 telefrag compatibility setting; validate these on the Deck."]

