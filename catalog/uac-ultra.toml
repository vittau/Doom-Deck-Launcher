[verification]
status = "inspected"
tester = "DDL desk research"
date = "2026-10-22"
engine_version = "0.30.1"
inspected = [
  "docs/research/reference-087-d.md §1 and §5",
  "Downloaded uacultra.zip from three byte-identical mirrors; 2,309,100 bytes, SHA-256 58ebd0fa…; ZIP central directory has exactly uacultra.txt (4,135 B) and uacultra.wad (7,473,347 B)",
  "uacultra.wad: PWAD, 505 lumps, twelve map markers MAP01–MAP12, fourteen D_* music lumps, one embedded DEHACKED lump; no COMPLVL, UMAPINFO or MAPINFO lump",
  "Authors' uacultra.txt: release 29th March 2010, v1.2, DOOM2, MAP01–MAP12, \"Boom-compatible. PrBoom-Plus recommended.\", Dehacked/BEX Patch: Yes, Music: Yes",
  "Cacowards 2010 Top Ten, page 2: https://www.doomworld.com/cacowards/2010/ (edition page read at https://web.archive.org/web/2026id_/https://www.doomworld.com/17years/best2.php; index https://www.doomworld.com/17years/ lists UAC Ultra on Page 2 of the Top Ten)",
  "Cacowards 2010 screenshot: https://web.archive.org/web/2026id_/https://www.doomworld.com/17years/images/uacultra.png",
]
notes = "Confirmed archive and member identities from downloads on www.gamers.org, mirrors.lug.mtu.edu and ftp.fu-berlin.de that return identical size and SHA-256; nothing downloaded was extracted to disk or executed. The WAD embeds its DEHACKED patch (new monster and boss changes) and all fourteen music lumps, so no separate -deh member or soundtrack package is needed. No COMPLVL or UMAPINFO lump exists: complevel boom comes from the authors' own \"Boom-compatible. PrBoom-Plus recommended.\" statement. Tags: cacowards = 2010 Top Ten winner (17th Annual Cacowards, page 2 of the Top Ten; the entry was read in the Wayback capture and the canonical year URL is https://www.doomworld.com/cacowards/2010/); classics = released 2010-03-29, over five years before this review. Not tagged megawad or episode: twelve maps is over the nine-map episode limit and under the thirty-map megawad limit. Not tagged challenging: the authors say the difficulty should \"keep you on your feet without being ridiculous\", which is not an experienced-players claim. No gameplay test was performed."
limitations = [
  "Needs Deck Validation: IWAD/complevel, load order, DEHACKED application, new-monster behaviour, gameplay, audio and map selection.",
  "The readme mentions a separate `ultratex.wad` texture set that is not part of this archive and has no source URL; it is not downloaded or declared.",
  "The bundled screenshot is a 640x480 (4:3) Cacowards image, the only reachable in-game view; confirm the card crop on the Deck.",
]

