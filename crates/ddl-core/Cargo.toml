[package]
name = "ddl-core"
description = "DoomDeckLauncher core logic (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Intentionally dependency-free: this crate is the platform-independent logic
# layer and must stay usable (and testable) without UI or OS crates.
[dependencies]

# Test helper for the engine runner tests (spec 003, A3): the tests must not run
# DSDA-Doom and must not use a shell string, so they start this tiny program and
# observe exit status, signal death, log capture and environment scrubbing.
# Only `crates/ddl` is released, so this target never ships.
[[bin]]
name = "ddl-launch-probe"
path = "src/bin/ddl-launch-probe.rs"
