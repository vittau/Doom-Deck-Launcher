[package]
name = "ddl-core"
description = "DoomDeckLauncher core logic (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Versions are pinned with `=` in the workspace `[workspace.dependencies]` table (or here,
# for crates only ddl-core uses): a `Cargo.lock` refresh must not silently pull a different
# release than the one reviewed.
[dependencies]
# Versioned machine state (JSON) and hand-authored data (TOML), D-006 — specs 002, 005.
serde.workspace = true
serde_json = "=1.0.154"
toml.workspace = true
# Catalog schema validation and opt-in fetch lint (spec 002).
url.workspace = true
semver.workspace = true
sha2.workspace = true
ureq.workspace = true
zip.workspace = true

[dev-dependencies]
# Test-only. Creates unique temporary directories for provisioning/guard/merge
# tests without touching the developer's real config (spec 005, A2–A5).
tempfile = "=3.27.0"

# Test helper for the engine runner tests (spec 003, A3): the tests must not run
# DSDA-Doom and must not use a shell string, so they start this tiny program and
# observe exit status, signal death, log capture and environment scrubbing.
# Only `crates/ddl` is released, so this target never ships.
[[bin]]
name = "ddl-launch-probe"
path = "src/bin/ddl-launch-probe.rs"
