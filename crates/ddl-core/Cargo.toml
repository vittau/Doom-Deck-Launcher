[package]
name = "ddl-core"
description = "DoomDeckLauncher core logic (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Versions are pinned with `=` in the workspace `[workspace.dependencies]` table: a
# `Cargo.lock` refresh must not silently pull a different release than the one reviewed.
# No UI and no OS-integration crates (decision D-005).
[dependencies]
# Versioned machine state (JSON) and hand-authored data (TOML), D-006 — specs 002, 005, 007.
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Catalog schema validation and opt-in fetch lint (spec 002); downloads (spec 006).
url.workspace = true
semver.workspace = true
ureq.workspace = true
zip.workspace = true
# Hashing: SHA-256 everywhere; SHA-1/MD5/CRC-32 for IWAD identification (spec 007).
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
crc32fast.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Test helper for the engine runner tests (spec 003, A3): the tests must not run
# DSDA-Doom and must not use a shell string, so they start this tiny program and
# observe exit status, signal death, log capture and environment scrubbing.
# Only `crates/ddl` is released, so this target never ships.
[[bin]]
name = "ddl-launch-probe"
path = "src/bin/ddl-launch-probe.rs"
