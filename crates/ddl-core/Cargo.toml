[package]
name = "ddl-core"
description = "DoomDeckLauncher core logic (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# No UI and no OS-integration crates (decision D-005): the logic layer stays
# testable without a display. The IWAD library (spec 007) adds the data-format
# and hashing crates listed in the workspace manifest.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
crc32fast = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
