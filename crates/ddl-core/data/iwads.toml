# Known-IWAD table (spec 007, R1).
#
# Every value below is transcribed from docs/research/iwad-identification.md and
# the sources it cites; nothing here is invented. Each hash-bearing entry cites
# the page that publishes its hashes in `source`; where a single hash comes from
# a different page (only the two SHA-256 rows) it is overridden in
# `hash_sources`. Sizes are bytes.
#
# `game` is the stable key a recipe requires (`doom`, `doom2`, `tnt`,
# `plutonia`, plus `nerve` for the No Rest for the Living expansion, which ships
# as a PWAD). `filename` is the canonical basename DDL symlinks to so that
# DSDA-Doom picks the right game mission (decision D-017).
#
# `default_complevel` follows research section 3 (doom 3, doom2 2, tnt/plutonia
# 4, nerve 2). The shareware entry is marked `playable = false`: commercial
# content refuses it.
#
# The GOG / id Anthology revisions of tnt.wad and plutonia.wad are listed
# below (research §1.3/§1.4); which GOG product ships them, as opposed to the
# Steam 1.9 copies, stays Needs Deck Validation (research open question 11).
#
# Deliberately NOT listed here yet, because the research marks them out of
# scope until they can be validated on the Deck or are not DDL targets: the BFG
# Edition and 2019 Unity "Enhanced" IWADs, and the remaining DOOM + DOOM II
# extra files (extras.wad, id1*.wad, id24res.wad, iddm1.wad, masterlevels.wad,
# sigil*.wad) for which no hashes are published. See research open questions 3,
# 4 and 8.

schema_version = 1

