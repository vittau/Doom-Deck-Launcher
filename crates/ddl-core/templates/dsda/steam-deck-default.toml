# DDL DSDA-Doom baseline template: `steam-deck-default` (spec 005, R2).
#
# This is hand-authored data, so it is stored as TOML (D-006). DDL renders it to
# DSDA's own line-oriented `name value` config format (R1) and writes the result
# to its private `<config dir>/dsda/active.cfg` (R3). It never edits the config a
# separately installed DSDA-Doom keeps under `~/.dsda-doom/` or
# `$XDG_DATA_HOME/dsda-doom/` (D-012).
#
# `values` and `strings` below list only the keys DDL owns. Unknown keys are
# rejected when the file is loaded, so a typo cannot silently claim ownership of
# a key DSDA would otherwise own.
#
# Every value that is marked "upstream default" was transcribed from DSDA-Doom
# v0.30.1 `prboom2/src/dsda/configuration.c` (see `docs/research/dsda-engine.md`
# §4 and §9). Those values are the engine's own defaults and are **not** Steam
# Deck tuning; the video baseline added in template v2 comes from the researched
# source and the first Deck test (spec 029, `docs/research/dsda-engine.md` §9).
# The controller layout added in template v3 is the owner's own layout (spec 034);
# its upstream defaults and button codes are transcribed in the same section.
# Template v4 adds the owner's frame-pacing and look-sensitivity preset from the
# first 0.0.7 Deck test (spec 056): VSync on, uncapped interpolation kept, and
# both mouse look sensitivities at 5. Its evidence is in
# `docs/research/dsda-engine.md` §10.

# Increments whenever the baseline changes; DDL uses it to detect a migration and
# to name `<config dir>/dsda/base/<template_version>.cfg` (R3, R5). Kept as a
# string so a future `1.1` needs no schema change.
template_version = "4"

# DSDA-Doom versions this template was written and checked against. Pinned to the
# one researched tagged release; see `docs/research/dsda-engine.md` (v0.30.1,
# commit 8ed581ad5c868b4dba1c39eb21d29e4ddbed9fad). Range ends are inclusive.
dsda_version_min = "0.30.1"
dsda_version_max = "0.30.1"

[values]
# --- DDL intent, not an upstream default -------------------------------------
# Enable the game controller. DSDA's upstream default is 0 (keyboard only), so
# DDL deliberately changes this to 1 so a fresh Deck has pad input in-game.
use_game_controller = 1

# --- upstream defaults, not Deck tuning --------------------------------------
# Keep mouse input enabled so trackpad / gyro-as-mouse keeps working alongside
# the pad (OVERVIEW §8.1); upstream default is already 1.
use_mouse = 1
# Analog response and deadzones (OVERVIEW §8.1); upstream defaults.
left_analog_deadzone = 6556
right_analog_deadzone = 6556
left_analog_sensitivity_x = 100
left_analog_sensitivity_y = 100
right_analog_sensitivity_x = 1536
right_analog_sensitivity_y = 768
analog_look_acceleration = 0
# Mouse response (OVERVIEW §8.1). Acceleration stays at DSDA's upstream 0, and
# Free Look Sensitivity (`mouse_sensitivity_mlook`) stays at its upstream 10.
# The owner's preset (spec 056, R2) is the two *look* sensitivities at 5:
# DSDA's own "Horizontal Sensitivity" and "Vertical Sensitivity" are
# `mouse_sensitivity_horiz` (upstream 10) and `mouse_sensitivity_vert` (upstream
# 1), not the analog-stick values below [m_menu.c:3564-3566]. The vertical key is
# new in v4, so `[upstream_values]` records its upstream default for the
# three-way migration.
dsda_mouse_acceleration = 0
mouse_sensitivity_horiz = 5
mouse_sensitivity_vert = 5
mouse_sensitivity_mlook = 10
# Analog roles and look direction (OVERVIEW §8.1); upstream defaults.
swap_analogs = 0
invert_analog_look = 0

# --- Steam Deck video baseline (spec 029, R4) --------------------------------
# Desktop fullscreen on the Deck's 1280×800 panel. `use_fullscreen` is 0
# (windowed) upstream; DDL turns it on, while `exclusive_fullscreen` stays 0 so
# gamescope can composite it (a mode change is not wanted).
# [configuration.c:1177-1184]
use_fullscreen = 1
exclusive_fullscreen = 0
# Force 16:10 widescreen rendering (the Deck panel's aspect) so the widescreen
# status bars of spec 017 have room; value 2 is 16:10 [v_video.c:1357-1376].
render_aspect = 2
# Scale the status bar / HUD to the full screen width (`patch_stretch_fit_to_width`
# = 2) so the wide STBAR fills the panel edge to edge [stretch.h:41-52].
render_stretch_hud = 2

# --- VSync and uncapped frame rate (spec 056, R1) ----------------------------
# The first 0.0.7 Deck test found the game drawing flat out with no VSync. DDL
# turns VSync on and keeps DSDA's uncapped (interpolated) frame rate on, so the
# renderer still interpolates every display frame but the buffer swap blocks at
# the panel refresh instead of rendering as many frames as the APU can.
# `render_vsync` upstream is 0 [configuration.c:1185-1188]; `uncapped_framerate`
# upstream is already 1 [configuration.c:1189-1192].
# DDL deliberately does NOT own `dsda_fps_limit`: its upstream default is 0
# (no limit), and setting a numeric cap here would defeat "uncapped FPS"
# [configuration.c:1193-1196]. Research §10 records how the three keys combine.
render_vsync = 1
uncapped_framerate = 1

# String keys: the native render resolution. DSDA parses `WIDTHxHEIGHT` and uses
# it in fullscreen [i_video.c:736-758]; the Deck panel is 1280×800.
[strings]
screen_resolution = "1280x800"

# DSDA-Doom v0.30.1 upstream defaults for the value keys that are new in this
# template version. The three-way merge (spec 005, R5) uses them exactly like a
# binding's `upstream` triple: if the previous baseline has no value for the key
# and the active file still holds this default, the player never touched it, so
# the template value wins. A player-edited value is kept and reported as a
# conflict instead. Only keys that already appear under [values] may be listed.
[upstream_values]
uncapped_framerate = 1
mouse_sensitivity_vert = 1
render_vsync = 0

# --- Steam Deck controller layout (spec 034, R2) -----------------------------
#
# One entry per DSDA action key that DDL binds. Each entry replaces the gamepad
# button of DSDA's v0.30.1 default and keeps that default's keyboard binding, so
# keyboard play is unchanged. DSDA has three input profiles and applies its
# defaults to all three [m_misc.c:696-701], so every entry is written to all
# three `|`-separated profile segments of the generated `input_*` line.
#
# `joy`/`mouse` are the numeric indices from [game_controller.h:22-49]; the file
# format uses integers, never the menu names. `upstream` is the complete default
# this entry replaces [m_misc.c:391-581]; the three-way merge uses it to tell "the
# player never touched this binding" from "the player rebound it in DSDA's menu"
# when a template version learns to own a binding (spec 005 R5; spec 034 R2).
#
# Button codes used below: 0 pad a, 1 pad b, 2 pad x, 3 pad y, 4 pad back,
# 5 pad guide, 6 pad start, 7 lstick, 8 rstick, 9 pad l (L1), 10 pad r (R1),
# 11 dpad u, 12 dpad d, 13 dpad l, 14 dpad r, 15-20 misc/paddles/touchpad,
# 21 pad lt, 22 pad rt.
#
# The owner's table only names the buttons below. Fire, strafe, movement, look
# and the menu actions keep DSDA's defaults. Use/open stays on DSDA's default
# A binding; DDL does not claim that key. Jump also keeps its default on B, so B
# toggles autorun and still jumps on maps that allow jumping (spec 034 R3).

# Automap toggle -> View. Upstream is Trigger Left [m_misc.c:425]; the keyboard
# Tab binding is kept. `pad back` is SDL's back button, which Steam's View button
# sends (Proposed, Deck validation pending; research §4).
[[bindings]]
action = "input_map"
keys = [9]
mouse = -1
joy = 4
upstream = { keys = [9], mouse = -1, joy = 21 }

# Automap zoom in -> D-pad Up. Upstream has no gamepad button [m_misc.c:443].
# D-pad Up keeps its menu [m_misc.c:473] and fly [m_misc.c:403] defaults: DSDA
# checks every action independently, and menus are handled before the automap.
[[bindings]]
action = "input_map_zoomin"
keys = [61]
mouse = -1
joy = 11
upstream = { keys = [61], mouse = -1, joy = -1 }

# Automap zoom out -> D-pad Down. Upstream has no gamepad button [m_misc.c:444].
[[bindings]]
action = "input_map_zoomout"
keys = [45]
mouse = -1
joy = 12
upstream = { keys = [45], mouse = -1, joy = -1 }

# Toggle run (autorun) -> B. Upstream is Left Stick click [m_misc.c:400].
[[bindings]]
action = "input_autorun"
keys = [186]
mouse = -1
joy = 1
upstream = { keys = [186], mouse = -1, joy = 7 }

# Next weapon -> D-pad Right. Upstream is Y [m_misc.c:418]; Y becomes unbound
# because DSDA allows one gamepad button per action per profile (research §4).
[[bindings]]
action = "input_nextweapon"
keys = [0]
mouse = -1
joy = 14
upstream = { keys = [0], mouse = -1, joy = 3 }

# Previous weapon -> D-pad Left. Upstream is X [m_misc.c:419].
[[bindings]]
action = "input_prevweapon"
keys = [0]
mouse = -1
joy = 13
upstream = { keys = [0], mouse = -1, joy = 2 }

# Quick save -> L1 (`pad l`). Upstream has no gamepad button [m_misc.c:436].
[[bindings]]
action = "input_quicksave"
keys = [192]
mouse = -1
joy = 9
upstream = { keys = [192], mouse = -1, joy = -1 }

# Quick load -> R1 (`pad r`). Upstream has no gamepad button [m_misc.c:437].
[[bindings]]
action = "input_quickload"
keys = [195]
mouse = -1
joy = 10
upstream = { keys = [195], mouse = -1, joy = -1 }

# Quick 180-degree turn -> X. Upstream is Right Stick click [m_misc.c:401]; the
# action is DSDA's `input_reverse`, which adds QUICKREVERSE (180 degrees) to the
# turn command [g_game.c:206, g_game.c:554-563]. Strict-mode demo recording
# disables it (research §5). X is free because previous weapon moved to D-pad
# Left; R3 becomes unbound.
[[bindings]]
action = "input_reverse"
keys = [47]
mouse = -1
joy = 2
upstream = { keys = [47], mouse = -1, joy = 8 }
