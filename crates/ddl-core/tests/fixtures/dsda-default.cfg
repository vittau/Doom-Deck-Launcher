# DSDA-Doom configuration fixture for spec 005 (A1).
#
# Built from the researched v0.30.1 defaults in docs/research/dsda-engine.md
# §3-§4 (configuration.c / m_misc.c). It is a synthetic file: it is NOT copied
# from a real user configuration and contains no personal paths.
#
# It deliberately mixes the constructs the format parser must handle: comments,
# a quoted string, decimal/octal/hex integers, a three-profile binding line and
# an unknown key that must survive as an opaque value.

use_game_controller 1
use_mouse 1
mouse_sensitivity_horiz 10
left_analog_deadzone 6556
screenshot_dir ""
hex_style_value 0x10
octal_style_value 010
negative_value -1
some_future_ddl_key kept verbatim

# input_fire: keyboard Ctrl (157) plus keypad-style extra (306), left mouse (0),
# right trigger (22); profiles 2 and 3 show an unbound keyboard key and no pad.
input_fire 157,306 0 22 | 0 0 22 | 0 -1 -1
