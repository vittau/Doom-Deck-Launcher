[package]
name = "ddl"
description = "DoomDeckLauncher: a native DOOM mapset launcher for Steam Deck"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# `cargo install` style metadata is deliberately omitted until a release spec
# asks for it; the binary is shipped as a tarball (spec 001, R7).

[[bin]]
name = "ddl"
path = "src/main.rs"

[dependencies]
ddl-core = { path = "../ddl-core" }
slint = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
slint-build = { workspace = true }
